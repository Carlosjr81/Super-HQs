// O leitor: página simples, a imagem inteira na tela. Tocar à direita avança,
// à esquerda volta, no meio mostra ou esconde os controles; setas e Esc no
// teclado. Guarda a página a cada virada. Fica com a página atual e as
// vizinhas prontas, e solta as outras (não decodifica o arquivo inteiro).
// A virada de livro (Etapa 3) e o Toque para Ler (Etapa 2) entram aqui.
function Leitor({ obra, inicio, onFechar, onProgresso }) {
  const [pagina, setPagina] = useState(Math.min(Math.max(0, inicio || 0), obra.paginas - 1));
  const [urls, setUrls] = useState({});
  const [erro, setErro] = useState("");
  const [controles, setControles] = useState(true);
  const [fim, setFim] = useState(false);
  const abridor = useRef(null);
  const pedidas = useRef({});
  const urlsRef = useRef({});
  // Os controles aparecem ao abrir e somem sozinhos: a arte ocupa a tela, e um
  // toque no meio os traz de volta.
  useEffect(() => { const t = setTimeout(() => setControles(false), 2500); return () => clearTimeout(t); }, []);

  useEffect(() => {
    let vivo = true;
    estanteDb.arquivo(obra.id)
      .then((blob) => { if (!blob) throw new Error("o arquivo não está mais neste aparelho"); return abrirArquivoDaEstante(blob, obra.tipo); })
      .then((ab) => { if (vivo) { abridor.current = ab; setUrls({}); } else ab.fechar(); })
      .catch((e) => { if (vivo) setErro((e && e.message) || "não consegui abrir"); });
    return () => {
      vivo = false;
      if (abridor.current) abridor.current.fechar();
      Object.values(urlsRef.current).forEach((u) => URL.revokeObjectURL(u));
    };
  }, [obra.id]);

  // a janela: a página atual, a próxima e a anterior
  useEffect(() => {
    const ab = abridor.current;
    if (!ab) return;
    const largura = Math.round(Math.min(2400, (window.innerWidth || 800) * (window.devicePixelRatio || 1)));
    const janela = [pagina, pagina + 1, pagina - 1, pagina + 2].filter((i) => i >= 0 && i < obra.paginas);
    janela.forEach((i) => {
      if (urlsRef.current[i] || pedidas.current[i]) return;
      pedidas.current[i] = true;
      ab.imagem(i, largura).then((b) => {
        delete pedidas.current[i];
        urlsRef.current[i] = URL.createObjectURL(b);
        setUrls(Object.assign({}, urlsRef.current));
      }).catch(() => { delete pedidas.current[i]; if (i === pagina) setErro("a página " + (i + 1) + " não abriu"); });
    });
    Object.keys(urlsRef.current).forEach((k) => {
      if (Math.abs(k - pagina) > 3) { URL.revokeObjectURL(urlsRef.current[k]); delete urlsRef.current[k]; }
    });
    onProgresso(obra, pagina);
  }, [pagina, urls === null, abridor.current]);

  const ir = useCallback((d) => {
    setFim(false);
    setPagina((p) => {
      const n = p + d;
      if (n >= obra.paginas) { setFim(true); return p; }
      return Math.max(0, n);
    });
  }, [obra.paginas]);
  useEffect(() => {
    const tecla = (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); ir(1); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); ir(-1); }
      else if (e.key === "Escape") onFechar();
    };
    window.addEventListener("keydown", tecla);
    return () => window.removeEventListener("keydown", tecla);
  }, [ir, onFechar]);

  const tocar = (e) => {
    const x = e.clientX / (window.innerWidth || 1);
    if (x < 0.3) ir(-1);
    else if (x > 0.7) ir(1);
    else setControles((c) => !c);
  };
  const barra = { position: "absolute", left: 0, right: 0, zIndex: 2, background: "rgba(7,8,13,0.86)", color: "#F5F7FF", padding: "10px 14px",
    display: "flex", alignItems: "center", gap: 10, backdropFilter: "blur(10px)", WebkitBackdropFilter: "blur(10px)" };
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 80, background: "var(--reader-canvas)", userSelect: "none", touchAction: "manipulation" }}>
      <div onClick={tocar} style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
        {urls[pagina]
          ? <img src={urls[pagina]} alt={"Página " + (pagina + 1) + " de " + obra.paginas} draggable={false}
              style={{ maxWidth: "100%", maxHeight: "100%", objectFit: "contain", display: "block" }} />
          : <div style={{ color: "#A6A6B3", fontSize: 14, padding: 24, textAlign: "center" }}>{erro || "Abrindo a página " + (pagina + 1) + "…"}</div>}
      </div>
      {controles && (
        <React.Fragment>
          <div style={{ ...barra, top: 0, paddingTop: "calc(10px + env(safe-area-inset-top))" }}>
            <button onClick={onFechar} aria-label="Voltar à estante" style={{ background: "none", border: "none", color: "#F2F2F5", fontSize: 22, cursor: "pointer", padding: "2px 6px" }}>✕</button>
            <div style={{ flex: 1, minWidth: 0, fontWeight: 800, fontSize: 14, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{obra.titulo}</div>
          </div>
          <div style={{ ...barra, bottom: 0, paddingBottom: "calc(10px + env(safe-area-inset-bottom))" }}>
            <button onClick={() => ir(-1)} aria-label="Página anterior" style={{ background: "none", border: "none", color: "#F2F2F5", fontSize: 20, cursor: "pointer" }}>‹</button>
            <input type="range" min={1} max={obra.paginas} value={pagina + 1} aria-label="Ir à página"
              onChange={(e) => { setFim(false); setPagina(+e.target.value - 1); }} style={{ flex: 1, accentColor: "#6F8CFF", minHeight: 44 }} />
            <span style={{ fontSize: 12.5, minWidth: 64, textAlign: "center" }}>{pagina + 1} / {obra.paginas}</span>
            <button onClick={() => ir(1)} aria-label="Próxima página" style={{ background: "none", border: "none", color: "#F2F2F5", fontSize: 20, cursor: "pointer" }}>›</button>
          </div>
        </React.Fragment>
      )}
      {fim && (
        <div style={{ position: "absolute", inset: 0, zIndex: 3, background: "rgba(0,0,0,0.82)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ ...S.card, maxWidth: 340, width: "100%", textAlign: "center" }}>
            <div style={{ fontSize: 13, letterSpacing: 2, color: "var(--cinza)", fontWeight: 800 }}>FIM</div>
            <div style={{ fontSize: 17, fontWeight: 900, margin: "6px 0 16px" }}>{obra.titulo}</div>
            <button style={S.btn} onClick={onFechar}>Voltar à estante</button>
            <button style={{ ...S.btnGhost, marginTop: 8 }} onClick={() => { setFim(false); setPagina(0); }}>Ler desde o início</button>
            <button style={{ ...S.btnGhost, marginTop: 8 }} onClick={() => setFim(false)}>Ficar na última página</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------------- ABERTURA ----------------
// A vinheta da marca, em vídeo, feita pelo dono (como a do Treino Livre).
// Enquanto ele não mandar o arquivo, fica vazio e o app abre direto. Quando
// chegar: abertura-v1.mp4, 720×1280, sem som. Vinheta nova entra com outro nome
// (v2): o service worker guarda o vídeo num cache próprio, que sobrevive às
// versões do app.
const VIDEO_ABERTURA = "";

// Só o vídeo. Vídeo que não começa em 5 s, ou que não abre, encerra a abertura
// em vez de prender alguém numa tela preta. Um toque pula. Movimento reduzido:
// sem abertura.
function Abertura({ onFim }) {
  const reduzido = useMemo(() => {
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
  }, []);
  const [tocando, setTocando] = useState(false);
  const tocandoRef = useRef(false);
  const acabouRef = useRef(false);
  const videoRef = useRef(null);
  const fim = () => { if (acabouRef.current) return; acabouRef.current = true; try { videoRef.current && videoRef.current.pause(); } catch (e) {} onFim(); };
  useEffect(() => {
    if (reduzido || !VIDEO_ABERTURA) { fim(); return; }
    const v = videoRef.current;
    if (!v) return;
    v.muted = true;
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
    const espera = setTimeout(() => { if (!tocandoRef.current) fim(); }, 5000);
    const t = setTimeout(fim, 18000);
    return () => { clearTimeout(espera); clearTimeout(t); };
  }, []);
  if (reduzido || !VIDEO_ABERTURA) return null;
  return (
    <div onClick={fim} role="img" aria-label="Super HQs"
      style={{ position: "fixed", inset: 0, zIndex: 90, background: "#090F21", overflow: "hidden", cursor: "pointer" }}>
      <video ref={videoRef} src={VIDEO_ABERTURA} playsInline muted preload="auto"
        poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
        onPlaying={() => { tocandoRef.current = true; setTocando(true); }}
        onEnded={fim} onError={() => { if (!tocandoRef.current) fim(); }}
        style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover",
          background: "#090F21", opacity: tocando ? 1 : 0, transition: "opacity 0.25s" }} />
      {tocando && (
        <div style={{ position: "absolute", left: 0, right: 0, bottom: "calc(18px + env(safe-area-inset-bottom))", zIndex: 2,
          textAlign: "center", color: "rgba(255,255,255,0.55)", fontSize: 12, letterSpacing: 1, pointerEvents: "none", fontFamily: "system-ui, -apple-system, sans-serif" }}>
          toque para pular
        </div>
      )}
    </div>
  );
}

// ---------------- COMO INSTALAR ----------------
// "Baixar" um PWA é adicionar à tela de início. O iPhone nunca oferece isso
// sozinho: sem o passo a passo, a pessoa conclui que não dá para instalar.
const EH_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || "") ||
  (/Mac/.test(navigator.userAgent || "") && navigator.maxTouchPoints > 1);
const EH_ANDROID = /Android/i.test(navigator.userAgent || "");

function ComoInstalar({ onFechar, onCopiarLink }) {
  const passos = NAVEGADOR_INAPP
    ? ["Toque nos ⋮ (ou ···) no canto desta tela.",
       "Escolha “Abrir no navegador” ou “Abrir no Chrome”.",
       "Lá dentro, toque em instalar quando o app oferecer."]
    : EH_IOS
      ? ["Toque no botão de compartilhar (o quadrado com a seta para cima), embaixo da tela.",
         "Role a lista e escolha “Adicionar à Tela de Início”.",
         "Confirme em “Adicionar”. Pronto: o ícone fica junto dos outros apps."]
      : EH_ANDROID
        ? ["Toque nos ⋮ no canto do Chrome.",
           "Escolha “Instalar aplicativo” (ou “Adicionar à tela inicial”).",
           "Confirme. O ícone aparece junto dos outros apps."]
        : ["Na barra de endereço, procure o ícone de instalar (uma telinha com uma seta).",
           "Clique nele e confirme em “Instalar”.",
           "O app abre em janela própria, sem as abas do navegador."];
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 95,
      display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}
      onClick={onFechar}>
      <div onClick={(e) => e.stopPropagation()}
        style={{ ...S.card, maxWidth: 400, width: "100%", margin: 0, maxHeight: "86vh", overflowY: "auto" }}>
        <div style={S.label}>📲 Instalar no seu aparelho</div>
        <div style={{ fontSize: 14.5, fontWeight: 800, margin: "8px 0 4px" }}>
          {EH_IOS ? "No iPhone é em dois toques" : "É rápido, e não ocupa quase nada"}
        </div>
        <div style={{ fontSize: 13, color: "var(--cinza)", lineHeight: 1.6, marginBottom: 14 }}>
          Instalado, ele abre em tela cheia, lê sem internet o que você já guardou e protege a sua
          estante melhor do que uma aba perdida no navegador.
        </div>
        {passos.map((p, i) => (
          <div key={i} style={{ display: "flex", gap: 10, marginBottom: 10, alignItems: "flex-start" }}>
            <span style={{ flexShrink: 0, width: 22, height: 22, borderRadius: 11, background: "var(--marca)",
              color: "var(--on-brand)", fontSize: 12, fontWeight: 800, textAlign: "center", lineHeight: "22px" }}>{i + 1}</span>
            <span style={{ fontSize: 13.5, lineHeight: 1.55 }}>{p}</span>
          </div>
        ))}
        {onCopiarLink && (
          <button style={{ ...S.btnGhost, marginTop: 8 }} onClick={onCopiarLink}>📋 Copiar o link do app</button>
        )}
        <button style={{ ...S.btn, marginTop: 8 }} onClick={onFechar}>Entendi</button>
      </div>
    </div>
  );
}

// ---------------- O APP ----------------
// As cinco abas do prompt (Início, Biblioteca, Buscar, Minhas leituras e
// Ajustes). Por enquanto só os Ajustes têm conteúdo: a fundação é a conta, a
// cobrança e a instalação. As outras dizem em que etapa entram.
const ABAS = [
  ["inicio", "🏠", "Início"],
  ["biblioteca", "📚", "Biblioteca"],
  ["buscar", "🔎", "Buscar"],
  ["leituras", "🔖", "Minhas leituras"],
  ["ajustes", "👤", "Perfil"],
];
const EM_BREVE = {
  leituras: ["Fila, Favoritos, Lidas, Histórico, Calendário e Downloads para ler sem internet.", "Etapa 4"],
};

function SuperHQs({ contaPendentes, contaPagamentos, onContaVista }) {
  const [abertura, setAbertura] = useState(true);
  const [aba, setAba] = useState("inicio");
  const [tema, setTema] = useState(() => { try { return (JSON.parse(store.get(STORAGE_KEY) || "{}").tema) || "escuro"; } catch (e) { return "escuro"; } });
  const [modal, setModal] = useState(null);
  const [versaoNova, setVersaoNova] = useState(null);
  const [comoInstalar, setComoInstalar] = useState(false);
  const [promptInstalar, setPromptInstalar] = useState(null);
  const [copiado, setCopiado] = useState(false);

  // A estante: as fichas vêm do IndexedDB; os arquivos só quando se lê.
  const [obras, setObras] = useState([]);
  const [ficha, setFicha] = useState(null);
  const [lendo, setLendo] = useState(null);
  const [importando, setImportando] = useState(null);
  const [categoria, setCategoria] = useState("todas");
  const [busca, setBusca] = useState({ termo: "", ordem: "recentes", estado: "todos", categoria: "todas" });
  const entradaArquivo = useRef(null);
  const recarregarEstante = useCallback(() => estanteDb.listar().then(setObras).catch(() => {}), []);
  useEffect(() => { recarregarEstante(); }, []);
  const abrirSeletor = () => { if (entradaArquivo.current) entradaArquivo.current.click(); };
  // Um por vez, com relatório no fim: arquivo ruim não trava os outros.
  const aoEscolherArquivos = async (e) => {
    const lista = Array.from(e.target.files || []);
    e.target.value = "";
    if (!lista.length) return;
    // Pedir para o navegador não apagar a estante quando faltar espaço
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (x) {}
    const rel = { novas: 0, repetidas: 0, erros: [] };
    for (let i = 0; i < lista.length; i++) {
      setImportando({ atual: i + 1, total: lista.length, nome: lista[i].name });
      let r;
      try { r = await importarArquivo(lista[i]); } catch (x) { r = { erro: (x && x.message) || "falhou" }; }
      if (r.obra) rel.novas++;
      else if (r.repetida) rel.repetidas++;
      else rel.erros.push(lista[i].name + ": " + r.erro);
    }
    setImportando(null);
    await recarregarEstante();
    registrarEvento("estante-importou");
    if (rel.erros.length || rel.repetidas || lista.length > 1) {
      setModal({ msg: [
        rel.novas ? "📚 " + rel.novas + " " + plural(rel.novas, "edição nova na estante.", "edições novas na estante.") : "",
        rel.repetidas ? "↺ " + rel.repetidas + " já " + plural(rel.repetidas, "estava", "estavam") + " na estante (o mesmo arquivo não entra duas vezes)." : "",
        rel.erros.length ? "Não entraram:\n• " + rel.erros.join("\n• ") : "",
      ].filter(Boolean).join("\n\n") });
    }
  };
  // A página lida é guardada a cada virada; a lista em memória acompanha.
  const guardarProgresso = useCallback((obra, pagina) => {
    const leitura = { pagina: pagina, em: Date.now() };
    setObras((l) => l.map((o) => (o.id === obra.id ? Object.assign({}, o, { leitura: leitura }) : o)));
    estanteDb.obra(obra.id).then((o) => { if (o) estanteDb.atualizar(Object.assign(o, { leitura: leitura })); }).catch(() => {});
  }, []);
  const mudarObra = (obra) => {
    setFicha(obra);
    setObras((l) => l.map((o) => (o.id === obra.id ? obra : o)));
    estanteDb.atualizar(obra).catch(() => {});
  };
  const apagarObra = (obra) => {
    setFicha(null);
    estanteDb.apagar(obra.id).then(recarregarEstante).catch(() => {});
  };

  useEffect(() => {
    document.documentElement.setAttribute("data-tema", tema);
    try {
      const d = JSON.parse(store.get(STORAGE_KEY) || "{}");
      d.tema = tema;
      store.set(STORAGE_KEY, JSON.stringify(d));
    } catch (e) {}
  }, [tema]);

  const pedirConfirmacao = (msg, onSim) => setModal(msg && typeof msg === "object" ? { ...msg, onSim } : { msg, onSim });

  // Fechar com Esc, como em qualquer caixa de diálogo
  useEffect(() => {
    if (!modal) return;
    const aoTeclar = (e) => { if (e.key === "Escape") setModal(null); };
    window.addEventListener("keydown", aoTeclar);
    return () => window.removeEventListener("keydown", aoTeclar);
  }, [modal]);

  // Confere se há versão nova. O "no-store" e o carimbo de tempo existem porque
  // o GitHub Pages manda max-age=600 e o navegador devolveria a cópia velha.
  useEffect(() => {
    let vivo = true;
    const conferir = () => {
      fetch("versao.json?t=" + Date.now(), { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((j) => { if (vivo && j && j.versao && j.versao !== VERSAO_APP) setVersaoNova(j.versao); })
        .catch(() => {});
    };
    const t = setTimeout(conferir, 2500);
    const aoVoltar = () => { if (document.visibilityState === "visible") conferir(); };
    document.addEventListener("visibilitychange", aoVoltar);
    return () => { vivo = false; clearTimeout(t); document.removeEventListener("visibilitychange", aoVoltar); };
  }, []);

  // Limpa o que o navegador guardou e recarrega: pedir "recarregar" à pessoa
  // não vence um cache de service worker. Os caches da estante e da vinheta ficam.
  const atualizarApp = useCallback(async () => {
    try {
      const ks = await caches.keys();
      await Promise.all(ks.filter((k) => k !== "superhqs-midia" && k !== "superhqs-acervo").map((k) => caches.delete(k)));
    } catch (e) {}
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.update().catch(() => {})));
    } catch (e) {}
    try { window.location.replace(window.location.pathname + "?v=" + Date.now()); }
    catch (e) { window.location.reload(); }
  }, []);

  // O navegador avisa quando o app pode ser instalado. O convite é guardado
  // para o botão "Instalar", em vez de a pessoa caçar a opção no menu.
  useEffect(() => {
    const aoPoderInstalar = (e) => { e.preventDefault(); setPromptInstalar(e); };
    const aoInstalar = () => { setPromptInstalar(null); registrarEvento("app-instalado"); };
    window.addEventListener("beforeinstallprompt", aoPoderInstalar);
    window.addEventListener("appinstalled", aoInstalar);
    return () => {
      window.removeEventListener("beforeinstallprompt", aoPoderInstalar);
      window.removeEventListener("appinstalled", aoInstalar);
    };
  }, []);
  const baixarApp = async () => {
    if (promptInstalar) {
      try { promptInstalar.prompt(); await promptInstalar.userChoice; } catch (e) {}
      setPromptInstalar(null);
      return;
    }
    registrarEvento("como-instalar");
    setComoInstalar(true);
  };
  const copiarLink = async () => {
    try { await navigator.clipboard.writeText(LINK_APP); setCopiado(true); setTimeout(() => setCopiado(false), 2500); } catch (e) {}
  };

  if (abertura) return <Abertura onFim={() => setAbertura(false)} />;
  if (lendo) return <Leitor obra={lendo.obra} inicio={lendo.pagina} onProgresso={guardarProgresso} onFechar={() => setLendo(null)} />;

  const daCategoria = buscarObras(obras, { categoria: categoria, ordem: "recentes" });
  const resultados = buscarObras(obras, busca);
  const lendoAgora = continuarLendo(obras, 12);
  const titulo = (ABAS.find((a) => a[0] === aba) || [0, 0, "Painel de usuários"])[2];
  return (
    <div style={S.app}>
      <div style={S.header}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div style={S.logo}>Super HQs</div>
            <div style={{ fontSize: 13, color: "var(--cinza)", fontWeight: 700 }}>{titulo}</div>
          </div>
          <button onClick={() => setTema(tema === "escuro" ? "claro" : "escuro")} aria-label={tema === "escuro" ? "Usar o tema claro" : "Usar o tema escuro"}
            style={{ background: "none", border: "1px solid var(--borda2)", borderRadius: 12, color: "var(--texto)", fontSize: 18, width: 42, height: 42, cursor: "pointer" }}>
            {tema === "escuro" ? "☀" : "☾"}
          </button>
        </div>
        <div style={S.faixa} />
      </div>

      <div style={{ padding: "14px 16px 0" }}>
        {(contaPendentes > 0 || contaPagamentos > 0) && aba !== "painelUsuarios" && (
          <button onClick={() => { if (onContaVista) onContaVista(); setAba("painelUsuarios"); }} style={{ ...S.btn, width: "100%", marginBottom: 12, padding: "12px 10px" }}>
            {contaPendentes > 0 ? "👥 " + contaPendentes + " " + plural(contaPendentes, "cadastro esperando", "cadastros esperando") + " a sua liberação" : ""}
            {contaPendentes > 0 && contaPagamentos > 0 ? " · " : ""}
            {contaPagamentos > 0 ? "💳 " + contaPagamentos + " " + plural(contaPagamentos, "pagamento", "pagamentos") + " para confirmar" : ""} ▶
          </button>
        )}

        {EM_BREVE[aba] && (
          <div style={S.card}>
            <div style={S.label}>{EM_BREVE[aba][1]} · em construção</div>
            <div style={{ fontSize: 15, lineHeight: 1.6, marginTop: 8 }}>{EM_BREVE[aba][0]}</div>
          </div>
        )}

        {importando && (
          <div role="status" style={{ ...S.card, borderColor: "var(--marca)" }}>
            <div style={{ fontSize: 14, fontWeight: 800 }}>Guardando {importando.atual} de {importando.total}…</div>
            <div style={{ fontSize: 12.5, color: "var(--cinza)", marginTop: 4, wordBreak: "break-all" }}>{importando.nome}</div>
          </div>
        )}

        {aba === "inicio" && (
          obras.length === 0 ? <EstanteVazia onImportar={abrirSeletor} /> : (
            <React.Fragment>
              <Prateleira titulo="Continuar lendo" obras={lendoAgora} onAbrir={setFicha}
                onVerTudo={() => { setBusca({ termo: "", ordem: "lidas", estado: "lendo", categoria: "todas" }); setAba("buscar"); }} />
              <Prateleira titulo="Adicionadas recentemente" obras={buscarObras(obras, { ordem: "recentes" }).slice(0, 12)} onAbrir={setFicha}
                onVerTudo={() => { setBusca({ termo: "", ordem: "recentes", estado: "todos", categoria: "todas" }); setAba("buscar"); }} />
              <Prateleira titulo="Lidas por último" obras={buscarObras(obras, { ordem: "lidas" }).filter((o) => o.leitura).slice(0, 12)} onAbrir={setFicha} />
              <button style={{ ...S.btnGhost, marginTop: 16 }} onClick={abrirSeletor}>＋ Abrir mais arquivos</button>
            </React.Fragment>
          )
        )}

        {aba === "biblioteca" && (
          obras.length === 0 ? <EstanteVazia onImportar={abrirSeletor} /> : (
            <React.Fragment>
              <button style={{ ...S.btn, marginBottom: 12 }} onClick={abrirSeletor}>＋ Abrir arquivos</button>
              <Chips opcoes={[["todas", "Tudo"]].concat(CATEGORIAS)} valor={categoria} onMudar={setCategoria} />
              {daCategoria.length ? <GradeObras obras={daCategoria} onAbrir={setFicha} />
                : <div style={{ ...S.card, color: "var(--cinza)", fontSize: 14 }}>Nada nesta categoria ainda. Abra uma edição e escolha a categoria na ficha dela.</div>}
            </React.Fragment>
          )
        )}

        {aba === "buscar" && (
          <React.Fragment>
            <CampoBusca valor={busca.termo} onMudar={(v) => setBusca({ ...busca, termo: v })} />
            <Chips opcoes={[["todas", "Tudo"]].concat(CATEGORIAS)} valor={busca.categoria} onMudar={(v) => setBusca({ ...busca, categoria: v })} />
            <Chips opcoes={[["todos", "Qualquer estado"], ["nova", "Não iniciadas"], ["lendo", "Lendo"], ["lida", "Lidas"]]} valor={busca.estado} onMudar={(v) => setBusca({ ...busca, estado: v })} />
            <select value={busca.ordem} onChange={(e) => setBusca({ ...busca, ordem: e.target.value })} aria-label="Ordenar"
              style={{ ...S.input, padding: "9px 12px", fontSize: 14, marginBottom: 14 }}>
              {ORDENS.map(([id, nome]) => <option key={id} value={id}>{nome}</option>)}
            </select>
            {(busca.termo || busca.categoria !== "todas" || busca.estado !== "todos") && (
              <button onClick={() => setBusca({ termo: "", ordem: busca.ordem, estado: "todos", categoria: "todas" })}
                style={{ background: "none", border: "none", color: "var(--brand-primary)", fontWeight: 600, fontSize: 14, cursor: "pointer", minHeight: 44, padding: 0, marginBottom: 4 }}>Limpar filtros</button>
            )}
            <div style={{ fontSize: 13, color: "var(--text-muted)", marginBottom: 12 }} role="status">{resultados.length} {plural(resultados.length, "edição", "edições")}</div>
            {resultados.length ? <GradeObras obras={resultados} onAbrir={setFicha} />
              : <div style={{ ...S.card, color: "var(--cinza)", fontSize: 14 }}>{obras.length ? "Nada encontrado com essa busca." : "A estante está vazia: abra arquivos na Biblioteca."}</div>}
          </React.Fragment>
        )}

        {aba === "painelUsuarios" && CONTA_ATUAL && CONTA_ATUAL.dono && (
          <TelaPainelUsuarios onVoltar={() => setAba("ajustes")} pedirConfirmacao={pedirConfirmacao} />
        )}

        {aba === "ajustes" && (
          <React.Fragment>
            <div id="aj-conta"><CartaoConta onPainel={() => setAba("painelUsuarios")} /></div>
            {!JA_INSTALADO && (
              <div style={S.card}>
                <div style={S.label}>📲 Instalar o app</div>
                <div style={{ fontSize: 13.5, color: "var(--cinza)", lineHeight: 1.55, margin: "6px 0 12px" }}>
                  Na tela de início, ele abre em tela cheia e guarda a sua estante com mais segurança.
                </div>
                <button style={S.btn} onClick={baixarApp}>Instalar o Super HQs</button>
                <button style={{ ...S.btnGhost, marginTop: 8 }} onClick={copiarLink}>{copiado ? "✓ Link copiado" : "📋 Copiar o link do app"}</button>
              </div>
            )}
            <div style={S.card}>
              <div style={S.label}>📚 O que você abre no app</div>
              <div style={{ fontSize: 13.5, lineHeight: 1.6, marginTop: 6 }}>{AVISO_CONTEUDO.curto}</div>
            </div>
            <div id="aj-termos"><CartaoTermos /></div>
            <div style={S.card}>
              <div style={S.label}>Créditos</div>
              <div style={{ fontSize: 13, color: "var(--cinza)", lineHeight: 1.6, marginTop: 6 }}>
                Criado por Carlos Jr. ·{" "}
                <a href={LINK_INSTAGRAM} target="_blank" rel="noopener" style={{ color: "var(--marca)", fontWeight: 800 }}>@{INSTAGRAM}</a>
                <br />© 2026 Carlos Jr. Todos os direitos reservados.
                <br />React e ReactDOM (MIT), Babel (MIT), qrcode-generator (MIT), pdf.js (Apache-2.0), fflate (MIT).
                <br />Versão {VERSAO_APP} · <a href="privacidade.html" style={{ color: "var(--marca)" }}>Privacidade</a>
              </div>
            </div>
          </React.Fragment>
        )}
      </div>

      <nav aria-label="Navegação principal" style={{ position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 20, background: "var(--barra)",
        boxShadow: "var(--barra-sombra)", borderTop: "1px solid var(--borda)", display: "flex",
        paddingBottom: "env(safe-area-inset-bottom)", backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)" }}>
        {ABAS.map(([id, ic, nome]) => (
          <button key={id} onClick={() => setAba(id)} aria-current={aba === id ? "page" : undefined}
            style={{ flex: 1, background: "none", border: "none", padding: "8px 2px", minHeight: 56, cursor: "pointer",
              color: aba === id ? "var(--brand-primary)" : "var(--text-muted)", fontWeight: aba === id ? 700 : 500, fontSize: 11 }}>
            <div style={{ fontSize: 20, lineHeight: 1.1 }} aria-hidden="true">{ic}</div>{nome}
          </button>
        ))}
      </nav>

      {modal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}
          onClick={() => setModal(null)}>
          <div role="dialog" aria-modal="true" aria-label={String(modal.msg || "Aviso").split("\n")[0]}
            style={{ ...S.card, width: "100%", maxWidth: 340, marginBottom: 0, borderColor: "var(--borda2)", maxHeight: "100%", boxSizing: "border-box", display: "flex", flexDirection: "column" }}
            onClick={(e) => e.stopPropagation()}>
            <div style={{ fontSize: 15, lineHeight: 1.6, marginBottom: 16, whiteSpace: "pre-line", overflowY: "auto", minHeight: 48, flex: "0 1 auto" }}>{modal.msg}</div>
            <div style={{ display: "flex", gap: 10 }}>
              {modal.onSim ? (
                <React.Fragment>
                  <button style={{ ...S.btnGhost, flex: 1 }} onClick={() => { const f = modal.onNao; setModal(null); if (f) f(); }}>{modal.labelNao || "Cancelar"}</button>
                  <button style={{ ...S.btn, flex: 1, background: modal.positivo ? GRAD : "var(--danger-fill)", color: modal.positivo ? "var(--on-brand)" : "var(--on-danger)" }}
                    onClick={() => { const f = modal.onSim; setModal(null); f(); }}>{modal.labelSim || "Confirmar"}</button>
                </React.Fragment>
              ) : (
                <button style={{ ...S.btn, flex: 1 }} onClick={() => setModal(null)}>OK</button>
              )}
            </div>
          </div>
        </div>
      )}

      {ficha && <FichaObra obra={ficha} onFechar={() => setFicha(null)} onMudar={mudarObra} onApagar={apagarObra}
        onLer={(obra, pagina) => { setFicha(null); setLendo({ obra: obra, pagina: pagina }); }} />}
      {/* Escondido: só existe para o "Abrir arquivos" abrir o seletor do aparelho */}
      <input ref={entradaArquivo} type="file" multiple accept=".pdf,.cbz,.cbr,.zip,application/pdf,application/zip,application/x-cbz,application/x-cbr,application/vnd.comicbook+zip"
        onChange={aoEscolherArquivos} style={{ display: "none" }} tabIndex={-1} aria-hidden="true" />
      {comoInstalar && <ComoInstalar onFechar={() => setComoInstalar(false)} onCopiarLink={copiarLink} />}

      {versaoNova && (
        <div role="status" style={{ position: "fixed", left: 12, right: 12, zIndex: 47, top: "calc(10px + env(safe-area-inset-top))" }}>
          <div style={{ background: "var(--card)", border: "1px solid var(--marca)", borderRadius: 14, padding: "12px 14px",
            boxShadow: "0 6px 20px rgba(0,0,0,0.5)", display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13.5, fontWeight: 800, lineHeight: 1.4 }}>Tem versão nova do app</div>
              <div style={{ fontSize: 11.5, color: "var(--cinza)", marginTop: 2 }}>Esta é a {VERSAO_APP}. Disponível: {versaoNova}.</div>
            </div>
            <button onClick={atualizarApp} style={{ background: GRAD, color: "var(--on-brand)", border: "none", borderRadius: 12, minHeight: 44,
              padding: "10px 14px", fontWeight: 900, fontSize: 13, cursor: "pointer", whiteSpace: "nowrap" }}>Atualizar</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Porteiro><SuperHQs /></Porteiro>);

// Modo offline: depois da primeira visita, o app abre mesmo sem internet.
// (localhost entra na lista para dar para testar o modo offline antes de publicar)
const ehLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
if ("serviceWorker" in navigator && (location.protocol === "https:" || ehLocal)) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
