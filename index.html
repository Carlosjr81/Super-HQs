// O painel: só o dono chega aqui, e só ele consegue ler a lista (as regras do
// Firestore recusam qualquer outra conta, mesmo que alguém abra esta tela).
// O histórico de aceites dos termos (só o dono lê: as regras garantem). É o
// registro para o dono se defender: quem aceitou, qual versão, quando (pelo
// servidor), onde e de que aparelho. Ninguém altera nem apaga pelo app.
function HistoricoAceites({ onVoltar, buscaInicial }) {
  const [lista, setLista] = useState(null);
  const [erro, setErro] = useState("");
  const [busca, setBusca] = useState(buscaInicial || "");
  const [aberto, setAberto] = useState(null);
  const carregar = async () => {
    setErro("");
    try { setLista(ordenarAceites(await contaApi.listarAceites((await tokenValido(lerSessaoConta())).idToken))); }
    catch (x) { setErro(erroDeConta(x.message) + (/PERMISSION/.test(x.message) ? " Publique as regras novas do Firebase (versão 4, firebase/firestore.rules)." : "")); setLista([]); }
  };
  useEffect(() => { carregar(); }, []);
  const b = semAcento(busca.trim().toLowerCase());
  const mostrar = (lista || []).filter((a) => !b || semAcento(((a.nome || "") + " " + (a.email || "")).toLowerCase()).indexOf(b) >= 0);
  const baixar = () => {
    const blob = new Blob([csvAceites(lista || [])], { type: "text/csv;charset=utf-8" });
    const el = document.createElement("a");
    el.href = URL.createObjectURL(blob);
    el.download = "aceites-termos-super-hqs-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(el); el.click(); el.remove();
    setTimeout(() => URL.revokeObjectURL(el.href), 4000);
  };
  return (
    <div>
      <button onClick={onVoltar} style={{ display: "block", background: "none", border: "none", color: "var(--marca)", fontWeight: 800, fontSize: 14, cursor: "pointer", padding: "4px 0 12px" }}>← Voltar ao painel</button>
      <div style={S.card}>
        <div style={S.label}>📜 Histórico de aceites dos termos</div>
        <div style={{ fontSize: 12.5, color: "var(--cinza)", margin: "4px 0 8px", lineHeight: 1.55 }}>
          Só a sua conta vê esta lista. Cada aceite é um registro que ninguém altera nem apaga pelo app (nem você), e que
          continua aqui mesmo se a pessoa apagar a conta. A hora "do servidor" é a do Google, não a do celular.
          Baixe a planilha de vez em quando e guarde uma cópia.
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={carregar} style={{ ...S.btnGhost, flex: 1, padding: "9px 8px", fontSize: 13 }}>🔄 Atualizar</button>
          <button onClick={baixar} disabled={!lista || !lista.length} style={{ ...S.btnGhost, flex: 1, padding: "9px 8px", fontSize: 13 }}>📥 Baixar (planilha)</button>
        </div>
      </div>
      {erro && <div role="alert" style={{ ...S.card, color: "var(--perigo)", fontSize: 13.5 }}>{erro}</div>}
      <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por nome ou e-mail" aria-label="Buscar aceites por nome ou e-mail" style={{ ...S.input, marginBottom: 10 }} />
      {lista === null && <div style={{ ...S.card, color: "var(--cinza)" }}>Carregando…</div>}
      {lista && !mostrar.length && !erro && <div style={{ ...S.card, color: "var(--cinza)", fontSize: 13.5 }}>Nenhum aceite {busca ? "com essa busca" : "registrado ainda"}.</div>}
      {mostrar.map((a) => (
        <div key={a.uid} style={S.card}>
          <div style={{ fontWeight: 900, fontSize: 15 }}>{a.nome || "(sem nome)"}</div>
          <div style={{ fontSize: 13, color: "var(--cinza)", wordBreak: "break-all" }}>{a.email}</div>
          <div style={{ fontSize: 12.5, lineHeight: 1.65, marginTop: 6 }}>
            ✅ Aceitou os termos de {a.termos ? new Date(a.termos + "T12:00:00").toLocaleDateString("pt-BR") : "?"}{a.termos !== TERMOS_USO.versao ? " (versão antiga)" : ""}
            <br />🕒 Servidor: <b>{dataHora(a.servidorEm) || "—"}</b> · celular: {dataHora(a.em)}
            <br />📍 {ONDE_ACEITE[a.de] || "Onde: não registrado"} · {a.aparelho || "aparelho ?"} · app {a.versaoApp || "?"}
          </div>
          <button onClick={() => setAberto(aberto === a.uid ? null : a.uid)} style={{ background: "none", border: "none", color: "var(--marca)", fontWeight: 800, fontSize: 12.5, cursor: "pointer", padding: "6px 0 0" }}>
            {aberto === a.uid ? "▴ Menos" : "▾ Ver tudo o que foi registrado"}
          </button>
          {aberto === a.uid && (
            <div style={{ fontSize: 12, color: "var(--cinza)", lineHeight: 1.6, marginTop: 6, wordBreak: "break-word" }}>
              <b>Caixas marcadas:</b> {(a.caixas || "").split(" | ").map((c, i) => <div key={i}>☑ {c}</div>)}
              <b>Conta (id):</b> {a.conta}<br />
              <b>Navegador:</b> {a.navegador || "—"}<br />
              <b>Impressão digital do texto (SHA-256):</b> {a.hash || "—"}<br />
              <span style={{ fontSize: 11.5 }}>O texto exato está no repositório, em termos-versoes/{a.termos}.txt: a impressão digital dele tem de ser esta.</span>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// A cobrança no painel do dono: a chave grátis/pago, os planos e o Pix, e os
// pagamentos que esperam confirmação.
function CartaoCobranca({ cob, carregado, lista, agora, semPlano, pagamentos, salvarCfg, pedirConfirmacao, cortesiaParaTodos, onVerPagamentos, onConfirmar, onRecusar, mexendo }) {
  const [editando, setEditando] = useState(false);
  const [recusando, setRecusando] = useState(null);
  if (!carregado) return null;
  const pend = (pagamentos || []).filter((p) => p.status === "informado");
  const rp = resumoPagamentos(pagamentos || [], agora);
  const temForma = !!cob.pix.chave || cob.planos.some((p) => p.ativo && p.link);
  const nSemPlano = lista.filter(semPlano).length;
  const fimTeste = fimDoDia(agora + cob.testeDias * 864e5);
  const ligar = () => pedirConfirmacao({ labelSim: "Ligar a cobrança",
    msg: "Ligar a cobrança no app inteiro?\n\n" +
      "• " + nSemPlano + " " + plural(nSemPlano, "conta liberada não tem", "contas liberadas não têm") + " plano nem cortesia.\n" +
      (cob.testeDias > 0 ? "• Todos ganham " + cob.testeDias + " dias de teste a partir de hoje: ninguém é barrado antes de " + new Date(fimTeste).toLocaleDateString("pt-BR") + ".\n" : "• Sem período de teste: quem não tem plano é barrado na próxima vez que abrir o app.\n") +
      "• Depois disso, quem não tiver plano, vitalício ou cortesia vê a tela de planos. Você continua entrando sempre.\n" +
      "• Dá para desligar quando quiser, e tudo volta a ser grátis na hora." +
      (temForma ? "" : "\n\n⚠ Você ainda não cadastrou a chave Pix nem um link de pagamento: ninguém vai conseguir pagar. Toque em Cancelar e cadastre em \"Planos, preços e Pix\".") },
    () => salvarCfg({ cobranca: true, cobrancaDesde: Date.now() }));
  const desligar = () => pedirConfirmacao({ positivo: true, labelSim: "Desligar", msg: "Desligar a cobrança?\n\nO app volta a ser grátis para todos na próxima vez que cada um abrir (ou em até 15 minutos). Os planos pagos e as cortesias continuam guardados." },
    () => salvarCfg({ cobranca: false }));
  return (
    <React.Fragment>
      <div style={{ ...S.card, borderColor: cob.ligada ? "var(--marca)" : undefined }}>
        <div style={S.label}>💰 Cobrança</div>
        <div style={{ fontSize: 15, fontWeight: 900, margin: "6px 0 4px" }}>{cob.ligada ? "Hoje: PAGO para todos" : "Hoje: GRÁTIS para todos"}</div>
        <div style={{ fontSize: 12.5, color: "var(--cinza)", lineHeight: 1.5 }}>
          {cob.ligada ? "Ligada desde " + new Date(cob.desde || agora).toLocaleDateString("pt-BR") + (cob.testeDias ? ", com " + cob.testeDias + " dias de teste para cada um." : ".") + " Entram quem tem plano, vitalício ou cortesia."
            : "Ninguém paga nada. Ligue a chave quando quiser que o app passe a ser pago: antes, confira os planos e o Pix."}
        </div>
        <button onClick={cob.ligada ? desligar : ligar} style={{ ...(cob.ligada ? S.btnGhost : S.btn), width: "100%", marginTop: 10 }}>
          {cob.ligada ? "Desligar a cobrança (voltar a ser grátis)" : "💰 Ligar a cobrança"}
        </button>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
          <button onClick={() => setEditando(!editando)} style={{ ...S.btnGhost, flex: "1 1 45%", padding: "9px 8px", fontSize: 13 }}>{editando ? "▴ Fechar" : "⚙ Planos, preços e Pix"}</button>
          <button onClick={onVerPagamentos} style={{ ...S.btnGhost, flex: "1 1 45%", padding: "9px 8px", fontSize: 13 }}>💳 Pagamentos ({(pagamentos || []).length})</button>
          {nSemPlano > 0 && (
            <button onClick={() => pedirConfirmacao({ positivo: true, labelSim: "Dar cortesia",
              msg: "Dar cortesia sem prazo para as " + nSemPlano + " contas liberadas que ainda não têm plano?\n\nÉ o jeito de quem já usava o app continuar de graça quando a cobrança for ligada. Dá para tirar de cada um depois." }, cortesiaParaTodos)}
              style={{ ...S.btnGhost, flex: "1 1 100%", padding: "9px 8px", fontSize: 13 }}>🎁 Cortesia para quem já usa ({nSemPlano})</button>
          )}
        </div>
        {(rp.confirmados > 0 || rp.aConfirmar > 0) && (
          <div style={{ fontSize: 12.5, color: "var(--cinza)", marginTop: 10, lineHeight: 1.5 }}>
            Recebido no mês: <b style={{ color: "var(--texto)" }}>{precoTexto(rp.mes)}</b> · no ano: {precoTexto(rp.ano)} · {rp.confirmados} {plural(rp.confirmados, "pagamento confirmado", "pagamentos confirmados")}
          </div>
        )}
        {editando && <EditorCobranca cob={cob} salvarCfg={async (c) => { if (await salvarCfg(c)) setEditando(false); }} />}
      </div>
      {pend.length > 0 && (
        <div style={{ ...S.card, borderColor: "var(--obs)" }}>
          <div style={S.label}>💳 Pagamentos para confirmar ({pend.length})</div>
          <div style={{ fontSize: 12.5, color: "var(--cinza)", lineHeight: 1.5, marginBottom: 6 }}>Confira no extrato do banco (o código do Pix aparece na transação) antes de confirmar.</div>
          {pend.map((p) => (
            <div key={p.uid} style={{ borderTop: "1px solid var(--borda2)", padding: "8px 0" }}>
              <div style={{ fontWeight: 900, fontSize: 14 }}>{p.nome || p.email} · {precoTexto(p.valor)}</div>
              <div style={{ fontSize: 12.5, color: "var(--cinza)", lineHeight: 1.5 }}>
                {p.planoNome || p.plano} · {p.metodo === "link" ? "link de pagamento" : "Pix"} · {dataHora(p.servidorEm || p.em)}<br />
                {p.email}{p.txid ? " · código " + p.txid : ""}{p.nota ? <><br />“{p.nota}”</> : null}
              </div>
              {recusando && recusando.uid === p.uid ? (
                <div style={{ marginTop: 6 }}>
                  <input value={recusando.motivo} onChange={(e) => setRecusando({ uid: p.uid, motivo: e.target.value })} placeholder="Motivo (a pessoa vê; ex.: pagamento não encontrado)" aria-label="Motivo da recusa" style={S.input} />
                  <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
                    <button onClick={() => setRecusando(null)} style={{ ...S.btnGhost, flex: 1, padding: "8px", fontSize: 13 }}>Cancelar</button>
                    <button onClick={() => { onRecusar(p, recusando.motivo); setRecusando(null); }} style={{ ...S.btnGhost, flex: 1, padding: "8px", fontSize: 13, color: "var(--perigo)", borderColor: "var(--perigo)" }}>✖ Recusar</button>
                  </div>
                </div>
              ) : (
                <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
                  <button disabled={mexendo === p.uid} onClick={() => onConfirmar(p)} style={{ ...S.btn, flex: 1, padding: "9px 8px", fontSize: 13.5 }}>✅ Confirmar</button>
                  <button onClick={() => setRecusando({ uid: p.uid, motivo: "" })} style={{ ...S.btnGhost, flex: 1, padding: "9px 8px", fontSize: 13.5 }}>✖ Recusar</button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </React.Fragment>
  );
}

// Os planos, os preços, o teste e o Pix. O código Pix de exemplo serve para o
// dono colar no app do banco e ver se o nome e a chave saem certos (o banco
// mostra o recebedor antes de pagar: é só não confirmar).
function EditorCobranca({ cob, salvarCfg }) {
  const [planos, setPlanos] = useState(() => cob.planos.map((p) => Object.assign({}, p, { precoTxt: String(p.preco).replace(".", ",") })));
  const [teste, setTeste] = useState(String(cob.testeDias));
  const [pix, setPix] = useState(cob.pix);
  const [salvando, setSalvando] = useState(false);
  const mudar = (id, campos) => setPlanos((l) => l.map((p) => (p.id === id ? Object.assign({}, p, campos) : p)));
  const num = (t) => Math.max(0, Math.round((parseFloat(String(t || "0").replace(",", ".")) || 0) * 100) / 100);
  const exemplo = pix.chave ? pixCopiaECola({ chave: pix.chave, nome: pix.nome, cidade: pix.cidade, valor: num((planos[0] || {}).precoTxt), txid: "TESTE" }) : "";
  const salvar = async () => {
    setSalvando(true);
    const limpos = planos.map((p) => ({ id: p.id, nome: String(p.nome || "").trim() || p.id, preco: num(p.precoTxt), dias: p.id === "vitalicio" ? 0 : Math.max(1, Math.round(+p.dias || 1)),
      ativo: !!p.ativo, link: /^https:\/\//.test(String(p.link || "").trim()) ? String(p.link).trim() : "" }));
    await salvarCfg({ planos: JSON.stringify(limpos), testeDias: Math.max(0, Math.min(60, Math.round(+teste || 0))),
      pixChave: String(pix.chave || "").trim(), pixNome: String(pix.nome || "").trim(), pixCidade: String(pix.cidade || "").trim() });
    setSalvando(false);
  };
  const campo = { ...S.input, padding: "8px 10px", fontSize: 14 };
  return (
    <div style={{ marginTop: 12, borderTop: "1px solid var(--borda2)", paddingTop: 10 }}>
      <div style={{ fontSize: 13, fontWeight: 900, marginBottom: 6 }}>Planos</div>
      {planos.map((p) => (
        <div key={p.id} style={{ border: "1px solid var(--borda2)", borderRadius: 12, padding: 10, marginBottom: 8, opacity: p.ativo ? 1 : 0.6 }}>
          <label style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 13.5, fontWeight: 800, cursor: "pointer" }}>
            <input type="checkbox" checked={p.ativo} onChange={(e) => mudar(p.id, { ativo: e.target.checked })} style={{ width: 20, height: 20, accentColor: "var(--marca)" }} />
            Oferecer o plano {p.id === "vitalicio" ? "vitalício" : p.id === "unico" ? "de pagamento único" : p.id}
          </label>
          <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
            <input value={p.nome} onChange={(e) => mudar(p.id, { nome: e.target.value })} maxLength={40} aria-label="Nome do plano" style={{ ...campo, flex: 2 }} />
            <input value={p.precoTxt} onChange={(e) => mudar(p.id, { precoTxt: e.target.value })} inputMode="decimal" aria-label="Preço em reais" style={{ ...campo, flex: 1 }} />
            {p.id !== "vitalicio" && <input value={p.dias} onChange={(e) => mudar(p.id, { dias: e.target.value })} inputMode="numeric" aria-label="Dias de acesso" style={{ ...campo, flex: 1 }} />}
          </div>
          <div style={{ fontSize: 11.5, color: "var(--cinza)", marginTop: 4 }}>nome · preço (R$){p.id !== "vitalicio" ? " · dias de acesso" : " · para sempre"}</div>
          <input value={p.link || ""} onChange={(e) => mudar(p.id, { link: e.target.value })} placeholder="Link de pagamento (opcional: Mercado Pago, PagSeguro, Stripe…)" aria-label="Link de pagamento"
            style={{ ...campo, marginTop: 6, fontSize: 12.5 }} />
        </div>
      ))}
      <label style={{ display: "block", fontSize: 13, fontWeight: 800, margin: "6px 0" }}>Dias de teste grátis (de cada cadastro, ou do dia em que a cobrança for ligada)
        <input value={teste} onChange={(e) => setTeste(e.target.value)} inputMode="numeric" style={{ ...campo, marginTop: 4 }} />
      </label>
      <div style={{ fontSize: 13, fontWeight: 900, margin: "10px 0 6px" }}>Pix</div>
      <input value={pix.chave} onChange={(e) => setPix(Object.assign({}, pix, { chave: e.target.value }))} placeholder="Chave Pix (e-mail, celular com +55, CPF/CNPJ ou aleatória)" aria-label="Chave Pix" style={{ ...campo, marginBottom: 6 }} />
      <input value={pix.nome} onChange={(e) => setPix(Object.assign({}, pix, { nome: e.target.value }))} placeholder="Nome do recebedor (como no banco)" maxLength={25} aria-label="Nome do recebedor" style={{ ...campo, marginBottom: 6 }} />
      <input value={pix.cidade} onChange={(e) => setPix(Object.assign({}, pix, { cidade: e.target.value }))} placeholder="Cidade" maxLength={15} aria-label="Cidade" style={campo} />
      {exemplo && (
        <div style={{ fontSize: 12, color: "var(--cinza)", marginTop: 8, lineHeight: 1.5 }}>
          Para conferir: copie este código e cole no Pix copia e cola do seu banco. Ele mostra o recebedor e o valor; é só não confirmar.
          <textarea readOnly value={exemplo} rows={3} aria-label="Código Pix de exemplo" onFocus={(e) => e.target.select()} style={{ ...campo, fontSize: 11.5, fontFamily: "monospace", marginTop: 4 }} />
        </div>
      )}
      <button disabled={salvando} onClick={salvar} style={{ ...S.btn, width: "100%", marginTop: 10 }}>{salvando ? "Salvando…" : "Salvar planos e Pix"}</button>
    </div>
  );
}

// Todos os pagamentos (só o dono lê): confirmar, recusar, devolver, buscar e
// baixar a planilha. É o livro-caixa do app.
function HistoricoPagamentos({ lista, buscaInicial, onVoltar, onConfirmar, onRecusar, onDevolver, pedirConfirmacao }) {
  const [busca, setBusca] = useState(buscaInicial || "");
  const [filtro, setFiltro] = useState("todos");
  const [motivo, setMotivo] = useState(null); // { uid, tipo, texto }
  const agora = Date.now();
  const todos = lista || [];
  const b = semAcento(busca.trim().toLowerCase());
  const mostrar = todos.filter((p) => (filtro === "todos" || p.status === filtro) && (!b || semAcento(((p.nome || "") + " " + (p.email || "") + " " + (p.txid || "")).toLowerCase()).indexOf(b) >= 0));
  const rp = resumoPagamentos(todos, agora);
  const baixar = () => {
    const url = URL.createObjectURL(new Blob([csvPagamentos(todos)], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = "pagamentos-super-hqs-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };
  return (
    <div>
      <button onClick={onVoltar} style={{ display: "block", background: "none", border: "none", color: "var(--marca)", fontWeight: 800, fontSize: 14, cursor: "pointer", padding: "4px 0 12px" }}>← Voltar ao painel</button>
      <div style={S.card}>
        <div style={S.label}>💳 Pagamentos</div>
        <div style={{ fontSize: 13.5, lineHeight: 1.6, margin: "6px 0" }}>
          Recebido no mês: <b>{precoTexto(rp.mes)}</b> · no ano: <b>{precoTexto(rp.ano)}</b> · desde o começo: {precoTexto(rp.total)}<br />
          {rp.aConfirmar} para confirmar · {rp.confirmados} {plural(rp.confirmados, "confirmado", "confirmados")}
        </div>
        <div style={{ fontSize: 12, color: "var(--cinza)", lineHeight: 1.5 }}>Só a sua conta vê esta lista. Os pagamentos não são apagados pelo app: recusar ou devolver deixa a marca.</div>
        <button onClick={baixar} disabled={!todos.length} style={{ ...S.btnGhost, width: "100%", marginTop: 8, fontSize: 13 }}>📥 Baixar (planilha)</button>
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
        {[["todos", "Todos"], ["informado", "⏳ A confirmar"], ["confirmado", "✅ Confirmados"], ["recusado", "✖ Recusados"], ["devolvido", "↩ Devolvidos"]].map((f) => (
          <button key={f[0]} onClick={() => setFiltro(f[0])} aria-pressed={filtro === f[0]}
            style={{ flex: "1 1 auto", padding: "8px", borderRadius: 10, cursor: "pointer", fontWeight: 800, fontSize: 12.5,
              border: "1px solid " + (filtro === f[0] ? "var(--marca)" : "var(--borda2)"), background: filtro === f[0] ? "var(--marca)" : "transparent", color: filtro === f[0] ? "#fff" : "var(--texto)" }}>{f[1]}</button>
        ))}
      </div>
      <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por nome, e-mail ou código do Pix" aria-label="Buscar pagamentos" style={{ ...S.input, marginBottom: 10 }} />
      {lista === null && <div style={{ ...S.card, color: "var(--cinza)" }}>Carregando…</div>}
      {lista && !mostrar.length && <div style={{ ...S.card, color: "var(--cinza)", fontSize: 13.5 }}>Nenhum pagamento {busca || filtro !== "todos" ? "com esse filtro" : "ainda"}.</div>}
      {mostrar.map((p) => {
        const st = STATUS_PAGAMENTO[p.status] || STATUS_PAGAMENTO.informado;
        const m = motivo && motivo.uid === p.uid ? motivo : null;
        return (
          <div key={p.uid} style={S.card}>
            <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
              <div style={{ fontWeight: 900, fontSize: 15 }}>{p.nome || "(sem nome)"} · {precoTexto(p.valor)}</div>
              <span style={{ fontSize: 12, fontWeight: 800, color: st.cor, whiteSpace: "nowrap" }}>{st.icone} {st.nome}</span>
            </div>
            <div style={{ fontSize: 12.5, color: "var(--cinza)", lineHeight: 1.6, marginTop: 4, wordBreak: "break-word" }}>
              {p.email} · {p.planoNome || p.plano} · {p.metodo === "manual" ? "registrado por você" : p.metodo === "link" ? "link de pagamento" : "Pix"}<br />
              Informado: {dataHora(p.servidorEm || p.em)}{p.confirmadoEm ? " · confirmado: " + dataHora(p.confirmadoEm) : ""}
              {p.txid ? <><br />Código do Pix: {p.txid}</> : null}
              {p.nota ? <><br />Observação: “{p.nota}”</> : null}
              {p.motivo ? <><br />Motivo: {p.motivo}</> : null}
              {p.condicoes ? <><br />Aceitou as condições da assinatura (versão {p.condicoes})</> : null}
            </div>
            {m ? (
              <div style={{ marginTop: 8 }}>
                <input value={m.texto} onChange={(e) => setMotivo(Object.assign({}, m, { texto: e.target.value }))} placeholder={m.tipo === "devolver" ? "Motivo (ex.: arrependimento em 7 dias)" : "Motivo (a pessoa vê)"} aria-label="Motivo" style={S.input} />
                <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
                  <button onClick={() => setMotivo(null)} style={{ ...S.btnGhost, flex: 1, padding: "8px", fontSize: 13 }}>Cancelar</button>
                  <button onClick={() => { (m.tipo === "devolver" ? onDevolver : onRecusar)(p, m.texto); setMotivo(null); }}
                    style={{ ...S.btnGhost, flex: 1, padding: "8px", fontSize: 13, color: "var(--perigo)", borderColor: "var(--perigo)" }}>{m.tipo === "devolver" ? "↩ Marcar devolvido" : "✖ Recusar"}</button>
                </div>
              </div>
            ) : p.status === "informado" ? (
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                <button onClick={() => onConfirmar(p)} style={{ ...S.btn, flex: 1, padding: "9px 8px", fontSize: 13.5 }}>✅ Confirmar</button>
                <button onClick={() => setMotivo({ uid: p.uid, tipo: "recusar", texto: "" })} style={{ ...S.btnGhost, flex: 1, padding: "9px 8px", fontSize: 13.5 }}>✖ Recusar</button>
              </div>
            ) : p.status === "confirmado" ? (
              <button onClick={() => setMotivo({ uid: p.uid, tipo: "devolver", texto: "" })} style={{ background: "none", border: "none", color: "var(--cinza)", fontWeight: 700, cursor: "pointer", fontSize: 12.5, padding: "8px 0 0" }}>↩ Devolvi o dinheiro (tira os dias deste pagamento)</button>
            ) : null}
          </div>
        );
      })}
    </div>
  );
}

function TelaPainelUsuarios({ onVoltar, pedirConfirmacao }) {
  const [verAceites, setVerAceites] = useState(null); // null | { busca }
  const [verPagamentos, setVerPagamentos] = useState(null); // null | { busca }
  const [cfgBruta, setCfgBruta] = useState(null);
  const [pagamentos, setPagamentos] = useState(null);
  const [acao, setAcao] = useState(null); // { uid, tipo: "cortesia" | "pagamento", ... }
  const cob = lerCobranca(cfgBruta);
  const [lista, setLista] = useState(null);
  const [erro, setErro] = useState("");
  const [filtro, setFiltro] = useState("todos");
  const [busca, setBusca] = useState("");
  const [mexendo, setMexendo] = useState(null);
  const [avisos, setAvisos] = useState({});
  const [aberto, setAberto] = useState(null);      // o "Mais opções" de qual conta
  const [editando, setEditando] = useState(null);  // { uid, campo, valor }
  const [escolhendoPrazo, setEscolhendoPrazo] = useState(null);
  const [auto, setAuto] = useState(null);
  const token = async () => (await tokenValido(lerSessaoConta())).idToken;
  const avisar = (uid, t) => setAvisos((a) => Object.assign({}, a, { [uid]: t }));
  const carregar = async () => {
    setErro("");
    try {
      const t = await token();
      const cfg0 = await contaApi.lerConfig(t).catch(() => null);
      setCfgBruta(cfg0 || {});
      setAuto(!!(cfg0 && cfg0.auto));
      setLista(ordenarContas(await contaApi.listar(t), Date.now(), lerCobranca(cfg0)));
      contaApi.listarPagamentos(t).then((l) => setPagamentos(ordenarPagamentos(l)), () => setPagamentos([]));
    } catch (x) { setErro(erroDeConta(x.message)); if (!lista) setLista([]); }
  };
  useEffect(() => { carregar(); }, []);
  // grava campos numa conta e reflete na lista sem recarregar tudo
  const gravar = async (c, campos, msgOk) => {
    setMexendo(c.uid);
    try {
      await contaApi.gravar(c.uid, campos, await token());
      setLista((l) => ordenarContas(l.map((x) => (x.uid === c.uid ? Object.assign({}, x, campos) : x)), Date.now(), cob));
      if (msgOk) avisar(c.uid, msgOk);
      setMexendo(null);
      return true;
    } catch (x) { setErro(erroDeConta(x.message)); setMexendo(null); return false; }
  };
  const liberar = (c, dias) => {
    setEscolhendoPrazo(null);
    const ate = prazoAte(dias, Date.now());
    gravar(c, { status: "liberado", ate: ate, motivo: "", decididoEm: Date.now() },
      "✅ Liberado" + (ate ? " até " + new Date(ate).toLocaleDateString("pt-BR") : " sem prazo") + ".");
  };
  const resetarSenha = async (c) => {
    setMexendo(c.uid);
    try {
      await contaApi.esqueci(c.email);
      avisar(c.uid, "🔑 Link de senha nova mandado para " + c.email + ". Avise a pessoa para olhar o e-mail (e o spam).");
      const agoraR = Date.now();
      try { await contaApi.gravar(c.uid, { senhaLinkEm: agoraR }, await token()); setLista((l) => l.map((x) => (x.uid === c.uid ? Object.assign({}, x, { senhaLinkEm: agoraR }) : x))); } catch (x) {}
    } catch (x) { avisar(c.uid, erroDeConta(x.message)); }
    setMexendo(null);
  };
  const remover = async (c) => {
    setMexendo(c.uid);
    try {
      await contaApi.apagarDoc(c.uid, await token());
      setLista((l) => l.filter((x) => x.uid !== c.uid));
    } catch (x) { setErro(erroDeConta(x.message)); }
    setMexendo(null);
  };
  const salvarEdicao = async () => {
    const e = editando;
    const c = (lista || []).find((x) => x.uid === e.uid);
    if (!c) { setEditando(null); return; }
    const v = String(e.valor || "").trim().slice(0, 500);
    let ok;
    if (e.campo === "aviso") ok = await gravar(c, { aviso: v, avisoEm: v ? Date.now() : 0 }, v ? "📩 Recado guardado: a pessoa vê na próxima vez que abrir o app." : "Recado apagado.");
    else if (e.campo === "bloquear") ok = await gravar(c, { status: "bloqueado", motivo: v, decididoEm: Date.now() }, "⛔ Bloqueado. A pessoa é barrada na próxima vez que abrir o app (ou em até 15 min).");
    else ok = await gravar(c, { [e.campo]: v }, "📝 Nota guardada (só você vê).");
    if (ok) setEditando(null);
  };
  const mudarAuto = async () => {
    const novo = !auto;
    try { await contaApi.gravarConfig({ auto: novo }, await token()); setAuto(novo); }
    catch (x) { setErro(erroDeConta(x.message) + " (Publique as regras novas do Firebase: firebase/firestore.rules.)"); }
  };
  const liberarTodos = async () => {
    const pend = (lista || []).filter((c) => situacaoConta(c, Date.now()) === "pendente");
    for (const c of pend) await gravar(c, { status: "liberado", ate: 0, motivo: "", decididoEm: Date.now() });
  };
  const baixarCsv = () => {
    const blob = new Blob([csvContas(lista || [], Date.now(), cob)], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "usuarios-super-hqs-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  const agora = Date.now();
  const r = resumoContas(lista || [], agora, cob);
  const mostrar = filtrarContas(lista || [], filtro, busca, agora, cob);
  // ---- a cobrança: as ações do dono ----
  const salvarCfg = async (campos, msgOk) => {
    try { await contaApi.gravarConfig(campos, await token()); setCfgBruta((c0) => Object.assign({}, c0 || {}, campos)); if (msgOk) setErro(""); return true; }
    catch (x) { setErro(erroDeConta(x.message) + " (Publique as regras novas do Firebase: firebase/firestore.rules.)"); return false; }
  };
  const mudarPagamento = (id, campos) => setPagamentos((l) => ordenarPagamentos((l || []).map((p) => (p.uid === id ? Object.assign({}, p, campos) : p))));
  // Confirmar: o pagamento e o acesso da conta numa gravação só (tudo ou nada).
  // O período é o que a pessoa comprou (os dias gravados no pagamento), não o
  // do plano de hoje, que o dono pode ter mudado depois.
  const confirmarPagamento = async (p) => {
    setMexendo(p.uid);
    try {
      const conta = (lista || []).find((c) => c.uid === p.conta);
      const base = planoPorId(cob, p.plano) || { id: p.plano, dias: 30 };
      const pl = Object.assign({}, base, { dias: p.plano === "vitalicio" ? 0 : p.dias > 0 ? p.dias : base.dias });
      const ag = Date.now();
      const campos = acessoPago(conta, pl, ag);
      const escritas = [contaApi.escrita("pagamentos/" + p.uid, { status: "confirmado", confirmadoEm: ag, motivo: "" }, { existe: true })];
      if (conta) escritas.push(contaApi.escrita("usuarios/" + conta.uid, campos, { existe: true }));
      await contaApi.commit(escritas, await token());
      mudarPagamento(p.uid, { status: "confirmado", confirmadoEm: ag, motivo: "" });
      if (conta) setLista((l) => ordenarContas(l.map((x) => (x.uid === conta.uid ? Object.assign({}, x, campos) : x)), Date.now(), cob));
      avisar(p.conta, "✅ Pagamento confirmado: " + (campos.vitalicio ? "acesso vitalício" : "acesso até " + new Date(campos.pagoAte).toLocaleDateString("pt-BR")) + ".");
    } catch (x) { setErro(erroDeConta(x.message)); }
    setMexendo(null);
  };
  const recusarPagamento = async (p, motivo) => {
    try { await contaApi.commit([contaApi.escrita("pagamentos/" + p.uid, { status: "recusado", motivo: String(motivo || "").slice(0, 200) }, { existe: true })], await token()); mudarPagamento(p.uid, { status: "recusado", motivo: motivo || "" }); }
    catch (x) { setErro(erroDeConta(x.message)); }
  };
  // Devolvido (o direito de arrependimento, ou um engano): o pagamento fica
  // marcado e os dias que ele deu saem da conta
  const devolverPagamento = async (p, motivo) => {
    try {
      const conta = (lista || []).find((c) => c.uid === p.conta);
      const campos = !conta ? null : p.plano === "vitalicio" ? { vitalicio: false } : { pagoAte: Math.max(0, (conta.pagoAte || 0) - (p.dias || 0) * 864e5) };
      const escritas = [contaApi.escrita("pagamentos/" + p.uid, { status: "devolvido", motivo: String(motivo || "").slice(0, 200) }, { existe: true })];
      if (campos) escritas.push(contaApi.escrita("usuarios/" + conta.uid, campos, { existe: true }));
      await contaApi.commit(escritas, await token());
      mudarPagamento(p.uid, { status: "devolvido", motivo: motivo || "" });
      if (campos) setLista((l) => ordenarContas(l.map((x) => (x.uid === conta.uid ? Object.assign({}, x, campos) : x)), Date.now(), cob));
    } catch (x) { setErro(erroDeConta(x.message)); }
  };
  // O dono recebeu por fora (dinheiro, transferência): registra e já libera
  const registrarPagamento = async (c, planoId, valor) => {
    setMexendo(c.uid);
    try {
      const pl = planoPorId(cob, planoId);
      const ag = Date.now();
      const campos = acessoPago(c, pl, ag);
      const pag = { conta: c.uid, email: c.email || "", nome: c.nome || "", plano: pl.id, planoNome: pl.nome, valor: Math.round((+valor || 0) * 100) / 100, dias: pl.dias,
        metodo: "manual", txid: "", nota: "Registrado pelo dono", condicoes: "", status: "confirmado", em: ag, confirmadoEm: ag };
      await contaApi.commit([contaApi.escrita("pagamentos/" + c.uid + "_" + ag, pag, { existe: false, servidor: "servidorEm" }),
        contaApi.escrita("usuarios/" + c.uid, campos, { existe: true })], await token());
      setPagamentos((l) => ordenarPagamentos([Object.assign({ uid: c.uid + "_" + ag }, pag)].concat(l || [])));
      setLista((l) => ordenarContas(l.map((x) => (x.uid === c.uid ? Object.assign({}, x, campos) : x)), Date.now(), cob));
      avisar(c.uid, "💳 Pagamento registrado: " + (campos.vitalicio ? "acesso vitalício" : "acesso até " + new Date(campos.pagoAte).toLocaleDateString("pt-BR")) + ".");
      setAcao(null);
    } catch (x) { setErro(erroDeConta(x.message)); }
    setMexendo(null);
  };
  const darCortesia = async (c, dias, motivo) => {
    const ok = await gravar(c, { cortesia: true, cortesiaAte: prazoAte(dias, Date.now()), cortesiaMotivo: String(motivo || "").slice(0, 120), cortesiaEm: Date.now() },
      "🎁 Cortesia dada" + (dias ? " por " + dias + " dias" : " sem prazo") + ".");
    if (ok) setAcao(null);
  };
  const semPlano = (c) => situacaoConta(c, agora) === "liberado" && !ehEmailDono(c.email) && planoDaConta(c, agora, Object.assign({}, cob, { ligada: false })).tipo === "gratis";
  const cortesiaParaTodos = async () => {
    for (const c of (lista || []).filter(semPlano)) await gravar(c, { cortesia: true, cortesiaAte: 0, cortesiaMotivo: "Usuário desde antes da cobrança", cortesiaEm: Date.now() });
  };
  const eu = CONTA_ATUAL && CONTA_ATUAL.uid;
  const chip = (id, rot, n) => (
    <button key={id} onClick={() => setFiltro(id)} aria-pressed={filtro === id}
      style={{ flex: "1 1 auto", padding: "8px 8px", borderRadius: 10, cursor: "pointer", fontWeight: 800, fontSize: 12.5,
        border: "1px solid " + (filtro === id ? "var(--marca)" : "var(--borda2)"), background: filtro === id ? "var(--marca)" : "transparent", color: filtro === id ? "#fff" : "var(--texto)" }}>{rot}{n ? " (" + n + ")" : ""}</button>
  );
  const numero = (n, rot, f) => (
    <button onClick={() => setFiltro(f)} style={{ flex: "1 1 30%", textAlign: "center", padding: "8px 4px", background: "none", border: "none", color: "var(--texto)", cursor: "pointer" }}>
      <div style={{ fontSize: 22, fontWeight: 900 }}>{n}</div>
      <div style={{ fontSize: 11, color: "var(--cinza)" }}>{rot}</div>
    </button>
  );
  const pequeno = { ...S.btnGhost, flex: "1 1 45%", padding: "8px 6px", fontSize: 12.5 };
  if (verAceites) return <HistoricoAceites buscaInicial={verAceites.busca} onVoltar={() => setVerAceites(null)} />;
  if (verPagamentos) return <HistoricoPagamentos lista={pagamentos} buscaInicial={verPagamentos.busca} onVoltar={() => setVerPagamentos(null)}
    onConfirmar={confirmarPagamento} onRecusar={recusarPagamento} onDevolver={devolverPagamento} pedirConfirmacao={pedirConfirmacao} />;
  return (
    <div>
      <button onClick={onVoltar} style={{ display: "block", background: "none", border: "none", color: "var(--marca)", fontWeight: 800, fontSize: 14, cursor: "pointer", padding: "4px 0 12px" }}>← Voltar</button>
      <div style={S.card}>
        <div style={S.label}>👥 Painel de usuários</div>
        <div style={{ fontSize: 12.5, color: "var(--cinza)", margin: "4px 0 8px", lineHeight: 1.5 }}>Só a sua conta vê esta tela. Toque num número para ver a lista dele.</div>
        <div style={{ display: "flex", flexWrap: "wrap" }}>
          {numero(r.total, "contas", "todos")}
          {numero(r.pendente, "aguardando", "pendente")}
          {numero(r.online, "online agora", "online")}
          {numero(r.hoje, "entraram hoje", "todos")}
          {numero(r.ativos7, "ativas em 7 dias", "liberado")}
          {numero(r.sumidos, "sumidas 30+ dias", "sumidos")}
        </div>
        <button onClick={carregar} style={{ ...S.btnGhost, width: "100%", marginTop: 6, fontSize: 13 }}>🔄 Atualizar a lista</button>
      </div>

      <CartaoCobranca cob={cob} carregado={cfgBruta !== null} lista={lista || []} agora={agora} semPlano={semPlano} pagamentos={pagamentos}
        salvarCfg={salvarCfg} pedirConfirmacao={pedirConfirmacao} cortesiaParaTodos={cortesiaParaTodos}
        onVerPagamentos={() => setVerPagamentos({ busca: "" })} onConfirmar={confirmarPagamento} onRecusar={recusarPagamento} mexendo={mexendo} />

      <div style={S.card}>
        <div style={S.label}>⚙ Como entram as contas novas</div>
        <label style={{ display: "flex", gap: 10, alignItems: "flex-start", marginTop: 8, cursor: "pointer", fontSize: 13.5, lineHeight: 1.5 }}>
          <input type="checkbox" checked={!!auto} disabled={auto === null} onChange={mudarAuto} style={{ marginTop: 3 }} />

// A estante pessoal: os arquivos que a própria pessoa abre (PDF, CBZ e, na
// próxima versão, CBR), guardados no aparelho. Só contas puras aqui, sem tela
// e sem navegador: o teste-estante.js recorta este trecho e roda no Node.
const EXT_IMAGEM = /\.(jpe?g|png|gif|webp|avif|bmp)$/i;
const MIME_IMAGEM = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif", webp: "image/webp", avif: "image/avif", bmp: "image/bmp" };
// Ordem natural: "Página 2" antes de "Página 10", e "#0.1" entre "#0" e "#1".
const ordemNatural = new Intl.Collator("pt-BR", { numeric: true, sensitivity: "base" }).compare;
// O tipo vem dos primeiros bytes, não do nome: muito "CBR" por aí é um ZIP
// renomeado, e muito ".cbz" baixado é outra coisa.
function tipoDoArquivo(bytes) {
  const b = bytes || [];
  if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return "pdf";
  if (b[0] === 0x50 && b[1] === 0x4B && b[2] === 0x03 && b[3] === 0x04) return "zip";
  if (b[0] === 0x52 && b[1] === 0x61 && b[2] === 0x72 && b[3] === 0x21) return "rar";
  if (b[0] === 0x37 && b[1] === 0x7A && b[2] === 0xBC && b[3] === 0xAF) return "7z";
  return null;
}
const NOME_FORMATO = { pdf: "PDF", zip: "CBZ", rar: "CBR", "7z": "CB7" };
// As páginas de um CBZ: só imagens, sem as pastas de lixo do Mac nem arquivos
// ocultos, em ordem natural (pasta e nome).
function paginasDoZip(nomes) {
  return nomes.filter((n) => EXT_IMAGEM.test(n) && !/(^|\/)(__MACOSX\/|\.)/.test(n)).sort(ordemNatural);
}
// O título de exibição sai do nome do arquivo, sem a extensão e sem os
// sublinhados. Nada além disso: autoria, ano e editora nunca são adivinhados
// pelo nome. O nome original fica guardado à parte, intacto.
function tituloDoArquivo(nome) {
  const base = String(nome || "").replace(/^.*[\\/]/, "").replace(/\.[^.]+$/, "");
  return base.replace(/_+/g, " ").replace(/\s+/g, " ").trim() || "Sem título";
}
const CATEGORIAS = [["hq", "HQs"], ["manga", "Mangás"], ["manhwa", "Manhwas"], ["livro", "Livros"]];
const ORDENS = [["recentes", "Adicionadas recentemente"], ["titulo", "Título A-Z"], ["lidas", "Lidas por último"]];
function estadoLeitura(o) {
  if (!o || !o.leitura) return "nova";
  return o.leitura.pagina >= (o.paginas || 1) - 1 ? "lida" : "lendo";
}
function progressoTexto(o) {
  const e = estadoLeitura(o);
  if (e === "nova") return "Não iniciada";
  if (e === "lida") return "Lida";
  return "Página " + (o.leitura.pagina + 1) + " de " + o.paginas;
}
// Busca sem acento, palavra por palavra, no título, no nome original e na
// coleção; filtro de categoria e de estado; ordem estável.
function buscarObras(lista, f) {
  const o = f || {};
  const palavras = semAcento(o.termo || "").split(" ").filter(Boolean);
  const cmp = {
    titulo: (a, b) => ordemNatural(a.titulo, b.titulo),
    recentes: (a, b) => (b.adicionadoEm || 0) - (a.adicionadoEm || 0) || ordemNatural(a.titulo, b.titulo),
    lidas: (a, b) => ((b.leitura && b.leitura.em) || 0) - ((a.leitura && a.leitura.em) || 0) || ordemNatural(a.titulo, b.titulo),
  }[o.ordem || "recentes"] || ((a, b) => ordemNatural(a.titulo, b.titulo));
  return (lista || []).filter((x) => {
    if (o.categoria && o.categoria !== "todas" && x.categoria !== o.categoria) return false;
    if (o.estado && o.estado !== "todos" && estadoLeitura(x) !== o.estado) return false;
    const texto = semAcento([x.titulo, x.nomeOriginal, x.colecao].filter(Boolean).join(" "));
    return palavras.every((p) => texto.indexOf(p) >= 0);
  }).sort(cmp);
}
// Continuar lendo: as começadas e não terminadas, a mais recente primeiro.
function continuarLendo(lista, n) {
  return (lista || []).filter((o) => estadoLeitura(o) === "lendo")
    .sort((a, b) => (b.leitura.em || 0) - (a.leitura.em || 0)).slice(0, n || 10);
}
function hexDe(buf) { return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join(""); }
function tamanhoTexto(bytes) {
  if (!(bytes > 0)) return "";
  return bytes < 1048576 ? Math.max(1, Math.round(bytes / 1024)) + " KB" : (bytes / 1048576).toFixed(1).replace(".", ",") + " MB";
}

// ---------------- ESTANTE: O ARMAZENAMENTO (IndexedDB) ----------------
// Duas gavetas: "obras" (a ficha, leve, com a capa reduzida) e "arquivos" (o
// arquivo original, pesado). A lista da estante lê só as fichas. O id é o
// SHA-256 do arquivo: o mesmo arquivo importado duas vezes não duplica, e o
// mesmo arquivo em outro aparelho tem o mesmo id (para a sincronia da Etapa 4).
const BANCO_ESTANTE = "superhqs-estante";
let bancoEstante = null;
function abrirBancoEstante() {
  if (!bancoEstante) {
    bancoEstante = new Promise((res, rej) => {
      const r = indexedDB.open(BANCO_ESTANTE, 1);
      r.onupgradeneeded = () => {
        r.result.createObjectStore("obras", { keyPath: "id" });
        r.result.createObjectStore("arquivos", { keyPath: "id" });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => { bancoEstante = null; rej(r.error); };
    });
  }
  return bancoEstante;
}
// Uma transação que só resolve quando o navegador confirma a gravação: o
// "gravou" antes do commit já enganou o Treino Livre uma vez (cota cheia).
async function transacaoEstante(lojas, modo, fazer) {
  const db = await abrirBancoEstante();
  return new Promise((res, rej) => {
    const tx = db.transaction(lojas, modo);
    const r = fazer(tx);
    tx.oncomplete = () => res(r && "result" in r ? r.result : true);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error("o aparelho recusou a gravação (espaço cheio?)"));
  });
}
const estanteDb = {
  listar: () => transacaoEstante("obras", "readonly", (tx) => tx.objectStore("obras").getAll()),
  obra: (id) => transacaoEstante("obras", "readonly", (tx) => tx.objectStore("obras").get(id)),
  arquivo: (id) => transacaoEstante("arquivos", "readonly", (tx) => tx.objectStore("arquivos").get(id)).then((r) => r && r.blob),
  guardar: (obra, blob) => transacaoEstante(["obras", "arquivos"], "readwrite", (tx) => {
    tx.objectStore("arquivos").put({ id: obra.id, blob: blob });
    tx.objectStore("obras").put(obra);
  }),
  atualizar: (obra) => transacaoEstante("obras", "readwrite", (tx) => tx.objectStore("obras").put(obra)),
  apagar: (id) => transacaoEstante(["obras", "arquivos"], "readwrite", (tx) => {
    tx.objectStore("obras").delete(id);
    tx.objectStore("arquivos").delete(id);
  }),
};

};
// Uma imagem de página maior que isto, descompactada, é recusada: protege o
// celular de um arquivo compactado feito para estourar a memória.
const LIMITE_PAGINA = 80 * 1048576;
let pdfJsPronto = null;
function carregarPdfJs() {
  if (!pdfJsPronto) {
    pdfJsPronto = carregarScript(LIB_ESTANTE.pdf.url, LIB_ESTANTE.pdf.sri).then(() => {
      const lib = window.pdfjsLib;
      lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(
        new Blob(['importScripts("' + LIB_ESTANTE.pdf.worker + '");'], { type: "text/javascript" }));
      return lib;
    }).catch((e) => { pdfJsPronto = null; throw e; });
  }
  return pdfJsPronto;
}
// Os dois abridores têm a mesma cara: quantas páginas, a imagem da página i
// (um Blob) e fechar. O leitor não sabe de que formato veio a revista.
async function abrirZip(blob) {
  await carregarScript(LIB_ESTANTE.fflate.url, LIB_ESTANTE.fflate.sri);
  const dados = new Uint8Array(await blob.arrayBuffer());
  const nomes = [];
  // filtro que sempre diz "não": lista o índice do ZIP sem descompactar nada
  window.fflate.unzipSync(dados, { filter: (f) => { if (f.originalSize <= LIMITE_PAGINA) nomes.push(f.name); return false; } });
  const paginas = paginasDoZip(nomes);
  return {
    paginas: paginas.length,
    async imagem(i) {
      const nome = paginas[i];
      const r = window.fflate.unzipSync(dados, { filter: (f) => f.name === nome });
      return new Blob([r[nome]], { type: MIME_IMAGEM[nome.split(".").pop().toLowerCase()] || "image/jpeg" });
    },
    fechar() {},
  };
}
async function abrirPdf(blob) {
  const lib = await carregarPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
  return {
    paginas: doc.numPages,
    // a página é desenhada na largura pedida (a da tela, vezes a densidade)
    async imagem(i, largura) {
      const pg = await doc.getPage(i + 1);
      const base = pg.getViewport({ scale: 1 });
      const v = pg.getViewport({ scale: Math.min(4, Math.max(0.5, (largura || 1200) / base.width)) });
      const c = document.createElement("canvas");
      c.width = Math.round(v.width); c.height = Math.round(v.height);
      await pg.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
      pg.cleanup();
      return new Promise((r) => c.toBlob(r, "image/jpeg", 0.9));
    },
    fechar() { try { doc.destroy(); } catch (e) {} },
  };
}
function abrirArquivoDaEstante(blob, tipo) {
  if (tipo === "pdf") return abrirPdf(blob);
  if (tipo === "zip") return abrirZip(blob);
  return Promise.reject(new Error("formato que ainda não abre: " + (NOME_FORMATO[tipo] || tipo)));
}
async function miniatura(blob, largura) {
  const bmp = await createImageBitmap(blob);
  const esc = Math.min(1, largura / bmp.width);
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * esc); c.height = Math.round(bmp.height * esc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  return new Promise((r) => c.toBlob(r, "image/jpeg", 0.82));
}
// Importar um arquivo: confere o tipo pelos bytes, calcula o id, lê a capa e
// guarda. Devolve { obra }, { repetida } ou { erro } — um arquivo ruim vira
// uma linha no relatório, nunca trava os outros.
async function importarArquivo(file) {
  const tipo = tipoDoArquivo(new Uint8Array(await file.slice(0, 8).arrayBuffer()));
  if (tipo === "rar") return { erro: "CBR (RAR) ainda não abre neste app: chega na próxima versão." };
  if (tipo === "7z") return { erro: "CB7 (7-Zip) ainda não abre neste app." };
  if (!tipo) return { erro: "não é PDF, CBZ nem CBR." };
  const id = hexDe(await crypto.subtle.digest("SHA-256", await file.arrayBuffer()));
  if (await estanteDb.obra(id)) return { repetida: true };
  let ab = null;
  try {
    ab = await abrirArquivoDaEstante(file, tipo);
    if (!ab.paginas) return { erro: "não achei nenhuma página dentro." };
    const capa = await miniatura(await ab.imagem(0, 600), 320);
    const obra = { id: id, titulo: tituloDoArquivo(file.name), nomeOriginal: file.name, tipo: tipo,
      tamanho: file.size, paginas: ab.paginas, capa: capa, categoria: "hq", adicionadoEm: Date.now(), leitura: null };
    await estanteDb.guardar(obra, file);
    return { obra: obra };
  } catch (e) {
    return { erro: /senha|password/i.test(String(e && e.message)) ? "o arquivo tem senha." : "não consegui abrir (" + ((e && e.message) || "arquivo danificado") + ")." };
  } finally { if (ab) ab.fechar(); }
}

// A capa: proporção vertical de revista (2:3), a arte inteira e sem esticar
// (contain); o que sobra fica no fundo neutro do cartão.
function Capa({ obra, largura }) {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    if (!obra.capa) return;
    const u = URL.createObjectURL(obra.capa);
    setUrl(u);
    return () => URL.revokeObjectURL(u);
  }, [obra.capa]);
  return (
    <div style={{ width: largura || "100%", aspectRatio: "2 / 3", borderRadius: 12, overflow: "hidden", background: "var(--surface-muted)", border: "1px solid var(--borda)" }}>
      {url && <img src={url} alt="" style={{ width: "100%", height: "100%", objectFit: "contain", display: "block" }} />}
    </div>
  );
}
