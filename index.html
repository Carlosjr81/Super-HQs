<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ---------------- ARMAZENAMENTO ----------------
// O mesmo `store` do Treino Livre: gravar devolve se gravou. Falhar calado
// aqui (cota cheia, janela anônima, navegador embutido) faria a pessoa achar
// que a estante foi salva quando não foi.
const memoria = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return memoria[k] != null ? memoria[k] : null; } },
  set(k, v) {
    try { localStorage.setItem(k, v); return true; }
    catch (e) { memoria[k] = v; return false; }
  },
};
const STORAGE_KEY = "superhqs:v1";
const LINK_APP = "https://carlosjr81.github.io/Super-HQs/";
// Quem fez. Uma constante só, porque o @ aparece em vários lugares.
const INSTAGRAM = "carlos.jr.81";
const LINK_INSTAGRAM = "https://instagram.com/" + INSTAGRAM;
// Qual versão está rodando neste aparelho. Aparece nos Ajustes.
// SOBE A CADA PUBLICAÇÃO, junto com o versao.json e o CACHE do sw.js.
const VERSAO_APP = "2026-10-31c";
// Rodando como app instalado: não faz sentido oferecer instalação a quem já instalou.
const JA_INSTALADO = (() => {
  try {
    return window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;
  } catch (e) { return false; }
})();
const NAVEGADOR_INAPP = /Instagram|FBAN|FBAV|FB_IAB|Line\/|; wv\)/i.test(navigator.userAgent || "");
// Aberto pelo app Android (o ícone do APK abre ?app=android). A marca fica na
// sessão da aba: a navegação dentro do app tira o ?app da barra.
const NO_APP_ANDROID = (() => {
  const daUrl = typeof location !== "undefined" && /[?&]app=android\b/.test(location.search);
  try {
    if (daUrl) { sessionStorage.setItem("superhqs:app", "1"); localStorage.setItem("superhqs:temApp", "1"); }
    return daUrl || sessionStorage.getItem("superhqs:app") === "1";
  } catch (e) { return daUrl; }
})();

// Registra eventos anônimos de uso (só contagem, sem dados pessoais)
function registrarEvento(nome) {
  try {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ path: nome, title: nome, event: true });
    }
  } catch (e) {}
}

// Concordância de número, para os textos não saírem como "pagamento(s)"
function plural(n, singular, pluralTxt) { return n === 1 ? singular : pluralTxt; }

// Carrega um script de CDN só quando a tela precisa dele (o QR do Pix, o botão
// do Google). Com SRI, o navegador recusa um arquivo adulterado.
const scriptsCarregados = {};
function carregarScript(src, sri) {
  if (!scriptsCarregados[src]) {
    scriptsCarregados[src] = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src;
      if (sri) { s.crossOrigin = "anonymous"; s.integrity = sri; }
      s.onload = res;
      s.onerror = () => { delete scriptsCarregados[src]; rej(new Error("não carregou: " + src)); };
      document.head.appendChild(s);
    });
  }
  return scriptsCarregados[src];
}

  try { j = await r.json(); } catch (e) {}

  }

const CHAVE_CONTA = "superhqs:conta";

// A impressão digital do texto aceito (SHA-256 do TERMOS_USO inteiro). A cópia
// exata de cada versão fica em termos-versoes/<versão>.txt: refazer a conta
// nela prova qual texto a pessoa aceitou.
async function impressaoTermos() {
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(JSON.stringify(TERMOS_USO)));
    return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, "0")).join("");
  } catch (e) { return ""; }
}
// Leva o aceite deste aparelho para o Firebase: o registro no histórico (só o
// dono lê) e os campos da conta (o painel). Calado: com as regras antigas o
// Firebase recusa, e o app tenta de novo na próxima conferida.
let registrandoAceite = false;
async function registrarAceite(naConta, nome) {
  const a = lerAceiteTermos();
  if (!a || a.v !== TERMOS_USO.versao || registrandoAceite) return;
  registrandoAceite = true;
  try {
    const s = await tokenValido(lerSessaoConta());
    if (!s || !s.uid) return;
    if (!a.reg) {
      const campos = { conta: s.uid, email: s.email, nome: nome || s.nome || "", termos: a.v, em: a.em, de: a.de || "",
        caixas: TERMOS_USO.caixas.join(" | "), hash: await impressaoTermos(),

      catch (x) { if (!/ALREADY_EXISTS/.test(x.message)) throw x; }
      gravarAceiteTermos(a.em, a.de, true);
    }
    if (naConta) await contaApi.gravar(s.uid, { termos: a.v, termosEm: a.em }, s.idToken);

        <button disabled={!pronto} onClick={() => onAceitar(antes ? "novos" : "tela")} style={{ ...S.btn, width: "100%", fontSize: 16, padding: "14px 10px", marginTop: 8, opacity: pronto ? 1 : 0.45 }}>
          ✅ Aceito e quero ler
        </button>
        {!pronto && <div style={{ fontSize: 12, color: "var(--cinza)", textAlign: "center", marginTop: 8 }}>Marque as duas caixas para continuar.</div>}
      </div>
      {onSair && (
        <div style={{ textAlign: "center" }}>
          <button onClick={onSair} style={{ background: "none", border: "none", color: "var(--cinza)", fontWeight: 700, cursor: "pointer", fontSize: 13, marginTop: 4 }}>Não aceito: sair</button>
        </div>
      )}
      {lendo && <JanelaTermos onFechar={() => setLendo(false)} />}
    </CaixaConta>
  );
}

// Quem está dentro, para os Ajustes (o cartão da conta e o painel do dono).
// Ponteiro de módulo: o porteiro está acima de tudo.
let CONTA_ATUAL = null;

function Porteiro({ children }) {
  const ligado = acessoLigado();
  const [fase, setFase] = useState(() => {
    if (!ligado) return "dentro";
    const s = lerSessaoConta();
    if (!s || !s.uid) return "entrar";
    return liberadoSemRede(s, Date.now()) ? "dentro" : "conferindo";
  });
  const [msg, setMsg] = useState("");
  const [pendentes, setPendentes] = useState(0);
  const [recado, setRecado] = useState(null);
  const [aceito, setAceito] = useState(termosAceitos);
  const [pagPend, setPagPend] = useState(0);
  const [assinando, setAssinando] = useState(false);
  const [avisoVence, setAvisoVence] = useState(null);
  const vistoEm = useRef(0);
  const conferindo = useRef(false);
  const contou = useRef(false);
  const sair = () => { gravarSessaoConta(null); CONTA_ATUAL = null; contou.current = false; setFase("entrar"); setMsg(""); };
  const conferir = async (forcarRenovar) => {
    if (conferindo.current) return;
    conferindo.current = true;
    let s = lerSessaoConta();
    try {
      if (!s) { setFase("entrar"); return; }
      if (forcarRenovar) s = Object.assign({}, s, { expira: 0 });
      s = await tokenValido(s);
      const dono = ehEmailDono(s.email);
      if (dono) {
        const u = await contaApi.conferir(s.idToken);
        if (!u || !u.emailVerified) { gravarSessaoConta(Object.assign({}, s, { status: null })); setFase("verificar"); return; }
        // a chave precisa trazer o e-mail confirmado: é o que as regras olham
        if (!s.verificado) { s = await tokenValido(Object.assign({}, s, { expira: 0, verificado: true })); }
      }
      let d = await contaApi.ler(s.uid, s.idToken);
      const agora = Date.now();
      // A regra de quem entra (aprovação automática e cobrança), que todos
      // leem. Sem resposta, vale a última que este aparelho conheceu.
      let cfg = null;
      try { cfg = await contaApi.lerConfig(s.idToken); } catch (x) { cfg = undefined; }
      const cob = cfg === undefined ? (s.cob || lerCobranca(null)) : lerCobranca(cfg);
      if (!d) {
        // aprovação automática ligada pelo dono: entra liberado. Com as regras
        // antigas no Firebase, a gravação "liberado" é recusada e cai no "pendente".
        const autoLib = !dono && !!(cfg && cfg.auto);
        const novo = { email: s.email, nome: s.nome || "", criadoEm: agora, ultimoAcesso: agora, acessos: 1,
          aparelho: aparelhoDe(navigator.userAgent, NO_APP_ANDROID), versao: VERSAO_APP };
        try { d = await contaApi.gravar(s.uid, Object.assign({}, novo, { status: dono || autoLib ? "liberado" : "pendente" }), s.idToken, true); }
        catch (x) { if (!autoLib) throw x; d = await contaApi.gravar(s.uid, Object.assign({}, novo, { status: "pendente" }), s.idToken, true); }
        contou.current = true;
        vistoEm.current = agora;
      } else if (dono && d.status !== "liberado") {
        d = await contaApi.gravar(s.uid, { status: "liberado" }, s.idToken);
      }
      const status = situacaoConta(d, agora, dono ? null : cob);
      // o aceite dos termos: o da conta vale neste aparelho (aceitou em outro),
      // e o do aparelho sobe para a conta (aceitou no cadastro)
      if (d && d.termos === TERMOS_USO.versao && !termosAceitos()) { gravarAceiteTermos(d.termosEm, "", true); setAceito(true); }
      else if (termosAceitos() && d && (d.termos !== TERMOS_USO.versao || !lerAceiteTermos().reg)) registrarAceite(d.termos !== TERMOS_USO.versao, d.nome);
      if (status === "liberado" && !contou.current) {
        contou.current = true;
        vistoEm.current = agora;
        contaApi.gravar(s.uid, { ultimoAcesso: agora, acessos: (d.acessos || 0) + 1, aparelho: aparelhoDe(navigator.userAgent, NO_APP_ANDROID), versao: VERSAO_APP }, s.idToken).catch(() => {});
      } else if (status === "liberado" && agora - vistoEm.current > 10 * 60000) {
        // de volta ao app: o "último acesso" do painel acompanha (é o "online")
        vistoEm.current = agora;
        contaApi.gravar(s.uid, { ultimoAcesso: agora }, s.idToken).catch(() => {});
      }
      if (status === "liberado" && recadoNovo(d)) setRecado({ texto: d.aviso, uid: s.uid });
      // a conta guardada leva o que decide o plano: sem rede, o vencimento
      // continua valendo (liberadoSemRede)
      const conta = d ? { email: d.email || s.email, criadoEm: d.criadoEm || 0, pagoAte: d.pagoAte || 0, vitalicio: !!d.vitalicio, plano: d.plano || "",
        cortesia: !!d.cortesia, cortesiaAte: d.cortesiaAte || 0, cortesiaMotivo: d.cortesiaMotivo || "" } : null;
      gravarSessaoConta(Object.assign({}, s, { status: d && d.status, ate: (d && d.ate) || 0, motivo: (d && d.motivo) || "", conferidoEm: agora, nome: (d && d.nome) || s.nome, cob: cob, conta: conta }));
      // o dono fica sabendo, ao abrir o app, de quem está esperando a liberação
      // e de quem avisou que pagou
      if (dono && status === "liberado") {
        contaApi.listar(s.idToken).then((l) => setPendentes(l.filter((c) => c.status === "pendente").length), () => {});
        contaApi.listarPagamentos(s.idToken).then((l) => setPagPend(l.filter((p) => p.status === "informado").length), () => {});
      }
      // O acesso perto de vencer (5 dias): um aviso por dia, com "Renovar"
      if (!dono && status === "liberado" && cob.ligada && conta) {
        const p = planoDaConta(conta, agora, cob);
        let visto = "";
        try { visto = localStorage.getItem("superhqs:avisoVence") || ""; } catch (x) {}
        if (["pago", "teste", "cortesia"].indexOf(p.tipo) >= 0 && p.ate > 0 && p.ate - agora < 5 * 864e5 && visto !== new Date(agora).toDateString()) setAvisoVence(p);
      }
      setFase(status === "liberado" ? "dentro" : status === "bloqueado" ? "bloqueado" : status === "vencido" ? "vencido" : status === "pagar" ? "pagar" : "aguardando");
    } catch (e) {
      if (e.semRede) {
        setFase((f) => (f === "dentro" ? "dentro" : liberadoSemRede(s, Date.now()) ? "dentro" : "semRede"));
      } else if (/TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|USER_DISABLED|INVALID_ID_TOKEN/.test(e.message)) {
        sair();
        setMsg(e.message === "USER_DISABLED" ? erroDeConta("USER_DISABLED") : "A sua sessão venceu. Entre de novo, por favor.");
      } else {
        setMsg(erroDeConta(e.message));
        setFase((f) => (f === "dentro" && liberadoSemRede(s, Date.now()) ? "dentro" : "erro"));
      }
    } finally { conferindo.current = false; }
  };
  useEffect(() => {
    if (!ligado || fase === "entrar") return undefined;
    conferir();
    // na volta ao app, confere de novo (no máximo a cada 15 min): é como um
    // bloqueio chega a quem já estava dentro
    let ultima = Date.now();
    const aoVoltar = () => {
      if (document.visibilityState !== "visible" || Date.now() - ultima < 15 * 60000) return;
      ultima = Date.now();
      conferir();
    };
    document.addEventListener("visibilitychange", aoVoltar);
    return () => document.removeEventListener("visibilitychange", aoVoltar);
  // eslint-disable-next-line
  }, [ligado, fase === "entrar"]);

    const aceitar = (de) => { gravarAceiteTermos(Date.now(), de); setAceito(true); if (ligado) registrarAceite(true); };
  if (!ligado) { CONTA_ATUAL = null; return aceito ? children : <TelaAceiteTermos onAceitar={aceitar} />; }
  const s = lerSessaoConta();
  if (fase === "dentro" && !aceito) { CONTA_ATUAL = null; return <TelaAceiteTermos onAceitar={aceitar} onSair={sair} />; }
  if (fase === "dentro") {
    CONTA_ATUAL = s ? { email: s.email, nome: s.nome, uid: s.uid, ate: s.ate || 0, dono: ehEmailDono(s.email) && !!s.verificado, sair: sair,
      cob: s.cob || null, plano: s.conta ? planoDaConta(s.conta, Date.now(), s.cob) : null, assinar: () => setAssinando(true) } : null;
    const app = CONTA_ATUAL && CONTA_ATUAL.dono ? React.cloneElement(children, { contaPendentes: pendentes, contaPagamentos: pagPend, onContaVista: () => { setPendentes(0); setPagPend(0); } }) : children;
    if (!recado && !assinando && !avisoVence) return app;
    const fecharAviso = () => { try { localStorage.setItem("superhqs:avisoVence", new Date().toDateString()); } catch (x) {} setAvisoVence(null); };
    return (
      <React.Fragment>
        {app}
        {recado && <RecadoDoDono texto={recado.texto} onOk={async () => {
          setRecado(null);
          try { const t2 = await tokenValido(lerSessaoConta()); await contaApi.gravar(recado.uid, { avisoVisto: Date.now() }, t2.idToken); } catch (x) {}
        }} />}
        {avisoVence && !recado && !assinando && (
          <div role="dialog" aria-label="O seu acesso vence logo" style={{ position: "fixed", inset: 0, zIndex: 400, background: "rgba(0,0,0,0.75)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
            <div style={{ ...S.card, maxWidth: 360, width: "100%", marginBottom: 0, textAlign: "center" }}>
              <div style={{ fontSize: 36 }} aria-hidden="true">⏳</div>
              <div style={{ fontSize: 17, fontWeight: 900, margin: "6px 0" }}>
                {avisoVence.tipo === "teste" ? "O seu período de teste" : avisoVence.tipo === "cortesia" ? "A sua cortesia" : "O seu plano"} acaba em {new Date(avisoVence.ate).toLocaleDateString("pt-BR")}
              </div>
              <div style={{ fontSize: 14, color: "var(--cinza)", lineHeight: 1.5, marginBottom: 14 }}>Renove antes para continuar lendo sem parar. A sua estante continua no aparelho de qualquer jeito.</div>
              <button onClick={() => { fecharAviso(); setAssinando(true); }} style={{ ...S.btn, width: "100%" }}>💳 Ver os planos</button>
              <button onClick={fecharAviso} style={{ ...S.btnGhost, width: "100%", marginTop: 8 }}>Depois</button>
            </div>
          </div>
        )}
        {assinando && (
          <div style={{ position: "fixed", inset: 0, zIndex: 450, background: "var(--bg)", overflowY: "auto" }}>
            <TelaAssinatura sessao={s} cob={s && s.cob} onFechar={() => setAssinando(false)} />
          </div>
        )}
      </React.Fragment>
    );
  }
  CONTA_ATUAL = null;
  if (fase === "entrar") return <TelaConta msgInicial={msg} onEntrou={() => { setMsg(""); setFase("conferindo"); }} />;
  if (fase === "pagar") return <TelaAssinatura sessao={s} cob={s && s.cob} barrado onSair={sair} onConferir={() => conferir()} />;
  return <TelaEsperaConta fase={fase} sessao={s} msg={msg} onConferir={() => { setFase("conferindo"); conferir(true); }} onConferirQuieto={() => conferir()} onSair={sair} />;
}

function CaixaConta({ children }) {
  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "24px 16px", boxSizing: "border-box", background: "var(--bg)", color: "var(--texto)", fontFamily: S.app.fontFamily }}>
      <div style={{ width: "100%", maxWidth: 380 }}>
        <div style={{ fontSize: 30, fontWeight: 800, textAlign: "center", marginBottom: 4, color: "var(--brand-primary)" }}>Super HQs</div>
        {children}
      </div>
    </div>
  );
}

function TelaConta({ onEntrou, msgInicial }) {
  // Quem nunca entrou neste aparelho chega em "Criar conta", que é o que ele
  // vai fazer; quem já entrou chega em "Entrar", com o e-mail preenchido.
  const emailSalvo = (() => { try { return localStorage.getItem(CHAVE_EMAIL_CONTA) || ""; } catch (e) { return ""; } })();
  const [modo, setModo] = useState(emailSalvo ? "entrar" : "criar"); // entrar | criar | esqueci
  const [nome, setNome] = useState("");
  const [email, setEmail] = useState(emailSalvo);
  const [senha, setSenha] = useState("");
  const [verSenha, setVerSenha] = useState(false);
  const [msg, setMsg] = useState(msgInicial || "");
  const [ok, setOk] = useState("");
  const [indo, setIndo] = useState(false);
  const [errou, setErrou] = useState(false);
  const [marcas, setMarcas] = useState([false, false]);
  const [lendoTermos, setLendoTermos] = useState(false);
  // "Continuar com o Google": aparece quando o dono liga o Google no Firebase
  // (o id do cliente vem do projeto; guardado para o botão vir na hora)
  const [google, setGoogle] = useState(() => { try { return localStorage.getItem("superhqs:googleId") || ""; } catch (e) { return ""; } });
  const googleRef = useRef(null);
  const atual = useRef({});
  atual.current = { modo: modo, marcas: marcas, onEntrou: onEntrou };
  useEffect(() => {
    contaApi.googleClientId().then((id) => {
      setGoogle(id);
      try { if (id) localStorage.setItem("superhqs:googleId", id); else localStorage.removeItem("superhqs:googleId"); } catch (e) {}
    }, () => {});
  }, []);
  const entrarComGoogle = async (resp) => {
    setMsg(""); setOk(""); setIndo(true);
    try {
      const j = await contaApi.entrarGoogle(resp && resp.credential);
      if (j.needConfirmation || !j.idToken) throw new Error("CONTA_COM_SENHA");
      const s = sessaoDeResposta(j, { nome: String(j.displayName || j.fullName || "").slice(0, 60), google: true });
      gravarSessaoConta(s);
      try { localStorage.setItem(CHAVE_EMAIL_CONTA, s.email); } catch (x) {}
      const a = atual.current;
      if (a.modo === "criar" && a.marcas[0] && a.marcas[1]) gravarAceiteTermos(Date.now(), "cadastro");
      a.onEntrou();
    } catch (x) { setMsg(erroDeConta(x.message)); }
    setIndo(false);
  };
  useEffect(() => {
    if (!google || modo === "esqueci" || !googleRef.current) return undefined;
    let vivo = true;
    carregarScript("https://accounts.google.com/gsi/client").then(() => {
      if (!vivo || !window.google || !window.google.accounts || !googleRef.current) return;
      window.google.accounts.id.initialize({ client_id: google, callback: (r) => entrarComGoogle(r), ux_mode: "popup", auto_select: false, use_fedcm_for_prompt: true });
      googleRef.current.innerHTML = "";
      window.google.accounts.id.renderButton(googleRef.current, { theme: "outline", size: "large", shape: "pill", locale: "pt-BR",
        text: modo === "criar" ? "signup_with" : "continue_with", width: Math.max(200, Math.min(360, googleRef.current.offsetWidth || 300)) });
    }).catch(() => {});
    return () => { vivo = false; };
  }, [google, modo]);
  const sugestao = sugerirEmail(email);
  const trocar = (m) => { setModo(m); setMsg(""); setOk(""); setErrou(false); };
  const mandarLink = async () => {
    const em = email.trim().toLowerCase();
    setIndo(true);
    try { await contaApi.esqueci(em); setMsg(""); setErrou(false); setOk("Pronto! Mandamos para " + em + " um link para criar uma senha nova. Abra o e-mail (olhe também o spam), crie a senha e volte aqui para entrar."); }
    catch (x) { setMsg(erroDeConta(x.message)); }
    setIndo(false);
  };
  const enviar = async (e) => {
    if (e) e.preventDefault();
    setMsg(""); setOk(""); setErrou(false);
    const em = email.trim().toLowerCase();
    if (modo === "criar" && !nome.trim()) { setMsg("Falta o seu nome: é assim que o criador do app sabe quem está pedindo acesso."); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { setMsg(erroDeConta("INVALID_EMAIL")); return; }
    if (modo === "esqueci") {
      setIndo(true);
      try { await contaApi.esqueci(em); setOk("Pronto! Se existir conta com " + em + ", chega um e-mail com o link para criar uma senha nova. Olhe também o spam."); }
      catch (x) { setMsg(erroDeConta(x.message)); }
      setIndo(false);
      return;
    }
    if (senha.length < 6) { setMsg(modo === "criar" ? "Crie uma senha com pelo menos 6 caracteres." : erroDeConta("MISSING_PASSWORD")); return; }
    if (modo === "criar" && !(marcas[0] && marcas[1])) { setMsg("Para criar a conta, leia e aceite os Termos de Uso: marque as duas caixas logo acima do botão."); return; }
    setIndo(true);
    try {
      const j = modo === "criar" ? await contaApi.criar(em, senha) : await contaApi.entrar(em, senha);
      const s = sessaoDeResposta(j, { nome: modo === "criar" ? nome.trim().slice(0, 60) : "" });
      gravarSessaoConta(s);
      try { localStorage.setItem(CHAVE_EMAIL_CONTA, em); } catch (x) {}
      if (modo === "criar" && ehEmailDono(em)) { try { await contaApi.confirmarEmail(s.idToken); } catch (x) {} }
      if (modo === "criar") gravarAceiteTermos(Date.now(), "cadastro");
      onEntrou();
    } catch (x) {
      // e-mail já cadastrado no "Criar": leva para o Entrar com o e-mail pronto
      if (/EMAIL_EXISTS/.test(x.message)) { setModo("entrar"); setSenha(""); }
      if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(x.message)) setErrou(true);
      setMsg(erroDeConta(x.message));
    }
    setIndo(false);
  };
  const campo = (rot, val, set, props, dica) => (
    <label style={{ display: "block", marginBottom: 12 }}>
      <span style={{ fontSize: 13, fontWeight: 800 }}>{rot}</span>
      <input value={val} onChange={(e) => set(e.target.value)} {...props} style={{ ...S.input, marginTop: 5, fontSize: 16 }} />
      {dica}
    </label>
  );
  const link = (txt, onClick) => (
    <button type="button" onClick={onClick} style={{ background: "none", border: "none", color: "var(--marca)", fontWeight: 800, cursor: "pointer", fontSize: 14, padding: "6px 4px" }}>{txt}</button>
  );
  const titulo = modo === "criar" ? "Crie a sua conta grátis" : modo === "esqueci" ? "Criar uma senha nova" : "Bem-vindo de volta";
  const sub = modo === "criar" ? "Leva 30 segundos. Depois é só esperar a liberação do criador do app."
    : modo === "esqueci" ? "Digite o seu e-mail: mandamos um link para você criar outra senha."
    : "Entre com o e-mail e a senha da sua conta.";
  return (
    <CaixaConta>
      <div style={{ textAlign: "center", margin: "6px 0 16px" }}>
        <div style={{ fontSize: 20, fontWeight: 900 }}>{titulo}</div>
        <div style={{ color: "var(--cinza)", fontSize: 14, marginTop: 4, lineHeight: 1.5 }}>{sub}</div>
      </div>
      {modo === "criar" && (
        <div style={{ display: "flex", justifyContent: "space-around", gap: 6, fontSize: 12, color: "var(--cinza)", textAlign: "center", marginBottom: 12 }}>
          <div><div style={{ fontSize: 22 }} aria-hidden="true">📚</div>Sua estante</div>
          <div><div style={{ fontSize: 22 }} aria-hidden="true">📖</div>Vira como livro</div>
          <div><div style={{ fontSize: 22 }} aria-hidden="true">🔎</div>Toque para Ler</div>
        </div>
      )}
      {google && modo !== "esqueci" && (
        <div style={{ marginBottom: 12 }}>
          <div ref={googleRef} style={{ display: "flex", justifyContent: "center", minHeight: 44 }} />
          <div style={{ display: "flex", alignItems: "center", gap: 10, color: "var(--cinza)", fontSize: 12.5, marginTop: 10 }}>
            <span style={{ flex: 1, height: 1, background: "var(--borda2)" }} />ou com e-mail e senha<span style={{ flex: 1, height: 1, background: "var(--borda2)" }} />
          </div>
        </div>
      )}
      <form onSubmit={enviar} style={{ ...S.card }} noValidate>
        {modo === "criar" && campo("Seu nome", nome, setNome, { autoComplete: "name", autoCapitalize: "words", placeholder: "Como você quer ser chamado", autoFocus: true, enterKeyHint: "next" })}
        {campo("E-mail", email, setEmail, { type: "email", inputMode: "email", autoComplete: "email", autoCapitalize: "none", autoCorrect: "off", spellCheck: false, placeholder: "seuemail@gmail.com", enterKeyHint: modo === "esqueci" ? "send" : "next", autoFocus: modo !== "criar" && !emailSalvo },
          sugestao ? (
            <button type="button" onClick={() => setEmail(sugestao)} style={{ display: "block", marginTop: 6, background: "none", border: "none", padding: 0, color: "var(--marca)", fontWeight: 800, fontSize: 13.5, cursor: "pointer", textAlign: "left" }}>
              Você quis dizer <u>{sugestao}</u>? Toque para corrigir.
            </button>
          ) : null)}
        {modo !== "esqueci" && (
          <div style={{ marginBottom: 12 }}>
            {/* o botão Mostrar fica fora do rótulo: dentro, o nome do campo virava "Senha Mostrar" */}
            <label htmlFor="conta-senha" style={{ fontSize: 13, fontWeight: 800 }}>{modo === "criar" ? "Crie uma senha" : "Senha"}</label>
            <div style={{ position: "relative", marginTop: 5 }}>
              <input id="conta-senha" value={senha} onChange={(e) => setSenha(e.target.value)} type={verSenha ? "text" : "password"} autoFocus={modo === "entrar" && !!emailSalvo}
                autoComplete={modo === "criar" ? "new-password" : "current-password"} enterKeyHint="go"
                placeholder={modo === "criar" ? "Pelo menos 6 caracteres" : ""} style={{ ...S.input, fontSize: 16, paddingRight: 70 }} />
              <button type="button" onClick={() => setVerSenha((v) => !v)} aria-label={verSenha ? "Esconder a senha" : "Mostrar a senha"}
                style={{ position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: "var(--marca)", fontWeight: 800, fontSize: 13, cursor: "pointer", padding: "6px 8px" }}>
                {verSenha ? "Esconder" : "Mostrar"}
              </button>
            </div>
          </div>
        )}
        {modo === "criar" && (
          <div style={{ border: "1px solid var(--borda2)", borderRadius: 14, padding: "10px 12px", marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
              <span style={{ fontSize: 13, fontWeight: 800 }}>📜 Termos de Uso</span>
              <button type="button" onClick={() => setLendoTermos(true)} style={{ background: "none", border: "none", color: "var(--marca)", fontWeight: 800, fontSize: 13, cursor: "pointer", padding: "4px 0" }}>Ler os termos</button>
            </div>
            <div style={{ fontSize: 12, color: "var(--cinza)", lineHeight: 1.45, margin: "2px 0 4px" }}>
              Acesso liberado pelo criador · só arquivos seus ou autorizados · a sua estante fica no seu aparelho.
            </div>
            <CaixasAceite marcas={marcas} setMarcas={(m) => { setMarcas(m); if (m[0] && m[1] && /Termos/.test(msg)) setMsg(""); }} />
          </div>
        )}
        {msg && <div role="alert" style={{ color: "var(--perigo)", fontSize: 14, lineHeight: 1.5, marginBottom: 12 }}>{msg}</div>}
        {errou && modo === "entrar" && (
          <button type="button" disabled={indo} onClick={mandarLink}
            style={{ ...S.btnGhost, width: "100%", marginBottom: 12, color: "var(--marca)", borderColor: "var(--marca)", fontWeight: 800 }}>
            🔑 Esqueci a senha: mandar o link para {email.trim().toLowerCase()}
          </button>
        )}
        {ok && <div role="status" style={{ color: "var(--ok)", fontSize: 14, lineHeight: 1.5, marginBottom: 12 }}>{ok}</div>}
        <button type="submit" disabled={indo} style={{ ...S.btn, width: "100%", fontSize: 16, padding: "14px 10px", opacity: indo ? 0.6 : 1 }}>
          {indo ? "Aguarde…" : modo === "criar" ? "Criar minha conta" : modo === "esqueci" ? "Mandar o link" : "Entrar"}
        </button>
        <div style={{ textAlign: "center", marginTop: 10, fontSize: 14, color: "var(--cinza)" }}>
          {modo === "criar" && <>Já tem conta? {link("Entrar", () => trocar("entrar"))}</>}
          {modo === "entrar" && <>Primeira vez aqui? {link("Criar conta", () => trocar("criar"))}<br />{link("🔑 Esqueci a senha", () => trocar("esqueci"))}</>}
          {modo === "esqueci" && link("← Voltar para entrar", () => trocar("entrar"))}
        </div>
      </form>
      <div style={{ fontSize: 12, color: "var(--cinza2)", textAlign: "center", lineHeight: 1.55, marginTop: 4 }}>
        🔒 A conta guarda só o seu nome, o e-mail e quando você entra. A sua estante continua no seu aparelho.{" "}
        <a href="privacidade.html" style={{ color: "var(--marca)" }}>Privacidade</a> ·{" "}
        <button type="button" onClick={() => setLendoTermos(true)} style={{ background: "none", border: "none", padding: 0, color: "var(--marca)", textDecoration: "underline", fontSize: 12, cursor: "pointer" }}>Termos de Uso</button>
      </div>
      {lendoTermos && <JanelaTermos onFechar={() => setLendoTermos(false)} />}
    </CaixaConta>
  );
}

// A estante é de quem lê: quem ficou sem acesso (plano vencido,
// bloqueado) baixa o backup sem precisar entrar no app.
function baixarBackupLocal() {
  try {
    const dados = localStorage.getItem(STORAGE_KEY) || "{}";
    const url = URL.createObjectURL(new Blob([dados], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "super-hqs-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  } catch (e) { return false; }
}
// O gerador de QR Code do Pix: só carrega na tela de planos (MIT, ver LICENSE)
const QR_LIB = { url: "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js", sri: "sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" };
// Os planos e o pagamento. "barrado": a cobrança está ligada e a pessoa não
// tem plano (a tela fica no lugar do app e confere sozinha a cada 30 s);
// sem ele, é a pessoa renovando por conta própria (abre por cima do app).
function TelaAssinatura({ sessao, cob, barrado, onSair, onFechar, onConferir }) {
  const c = cob || lerCobranca(null);
  const planos = planosAtivos(c);
  const [escolhido, setEscolhido] = useState(() => (planos.find((p) => p.id === "anual") || planos[0] || {}).id);
  const [aceito, setAceito] = useState(false);
  const [nota, setNota] = useState("");
  const [meus, setMeus] = useState(null);
  const [msg, setMsg] = useState("");
  const [indo, setIndo] = useState(false);
  const [qr, setQr] = useState("");
  const [copiado, setCopiado] = useState(false);
  const [backup, setBackup] = useState("");
  // o código do pagamento fica o mesmo enquanto a tela está aberta: é ele que
  // vai no Pix e no aviso, e é por ele que o dono acha o pagamento no extrato
  const [emRef] = useState(() => Date.now());
  const plano = planoPorId(c, escolhido);
  const uid = sessao && sessao.uid;
  const txid = txidPagamento(uid, emRef);
  const temPix = !!(c.pix && c.pix.chave);
  const copia = plano && temPix ? pixCopiaECola({ chave: c.pix.chave, nome: c.pix.nome, cidade: c.pix.cidade, valor: plano.preco, txid: txid }) : "";
  const carregarMeus = async () => {
    try { const s = await tokenValido(lerSessaoConta()); setMeus(ordenarPagamentos(await contaApi.meusPagamentos(s.uid, s.idToken))); }
    catch (x) { setMeus([]); }
  };
  useEffect(() => { carregarMeus(); }, []);
  useEffect(() => {
    if (!barrado || !onConferir) return undefined;
    const t = setInterval(() => { if (document.visibilityState === "visible") { onConferir(); carregarMeus(); } }, 30000);
    return () => clearInterval(t);
  }, [barrado]);
  useEffect(() => {
    setQr(""); setCopiado(false);
    if (!copia) return undefined;
    let vivo = true;
    carregarScript(QR_LIB.url, QR_LIB.sri).then(() => {
      if (!vivo || !window.qrcode) return;
      const q = window.qrcode(0, "M"); q.addData(copia); q.make(); setQr(q.createDataURL(5, 2));
    }).catch(() => {});
    return () => { vivo = false; };
  }, [copia]);
  const pendente = (meus || []).find((p) => p.status === "informado");
  const copiar = () => {
    try { navigator.clipboard.writeText(copia).then(() => setCopiado(true), () => setCopiado(false)); } catch (x) {}
  };
  const informar = async (metodo) => {
    if (!aceito) { setMsg("Marque que leu e aceita as condições da assinatura."); return; }
    setIndo(true); setMsg("");
    try {
      const s = await tokenValido(lerSessaoConta());
      const em = Date.now();
      const campos = { conta: s.uid, email: s.email, nome: s.nome || "", plano: plano.id, planoNome: plano.nome, valor: plano.preco, dias: plano.dias,
        metodo: metodo, txid: txid, nota: nota.trim().slice(0, 200), condicoes: CONDICOES_ASSINATURA.versao, status: "informado", em: em,
        aparelho: aparelhoDe(navigator.userAgent, NO_APP_ANDROID), versaoApp: VERSAO_APP };
      await contaApi.commit([contaApi.escrita("pagamentos/" + s.uid + "_" + em, campos, { existe: false, servidor: "servidorEm" })], s.idToken);
      setMsg("✅ Pronto! O criador do app foi avisado. Assim que ele confirmar o pagamento, " + (barrado ? "o app abre sozinho aqui." : "o seu acesso é renovado."));
      carregarMeus();
    } catch (x) {
      setMsg(erroDeConta(x.message) + (/PERMISSION/.test(x.message) ? " (O criador do app ainda precisa atualizar as regras do servidor.)" : ""));
    }
    setIndo(false);
  };
  const p = sessao && sessao.conta ? planoDaConta(sessao.conta, Date.now(), c) : null;
  const porPeriodo = (pl) => pl.id === "vitalicio" ? "uma vez · para sempre" : pl.id === "mensal" ? "por mês" : pl.id === "anual" ? "por ano · " + precoTexto(pl.preco / 12) + " por mês"
    : "uma vez · " + pl.dias + " dias de acesso";
  const conteudo = (
    <div>
      <div style={{ textAlign: "center", margin: "6px 0 14px" }}>
        <div style={{ fontSize: 38 }} aria-hidden="true">💪</div>
        <div style={{ fontSize: 20, fontWeight: 900 }}>{barrado ? "Continue lendo no Super HQs" : "Planos e pagamento"}</div>
        <div style={{ color: "var(--cinza)", fontSize: 14, marginTop: 4, lineHeight: 1.5 }}>
          {barrado ? (p && p.ate > 0 ? "O seu período gratuito terminou em " + new Date(p.ate).toLocaleDateString("pt-BR") + ". " : "O Super HQs agora é pago. ") : (p ? "Hoje: " + textoPlanoConta(p, c) + ". " : "")}
          Escolha um plano: a sua estante continua toda no seu aparelho.
        </div>
      </div>
      {pendente && (
        <div style={{ ...S.card, borderColor: "var(--obs)" }}>
          <div style={{ fontWeight: 900, fontSize: 15 }}>⏳ Pagamento informado</div>
          <div style={{ fontSize: 13.5, color: "var(--cinza)", lineHeight: 1.5, marginTop: 4 }}>
            {pendente.planoNome || pendente.plano} · {precoTexto(pendente.valor)} · {dataHora(pendente.em)}. Aguardando a confirmação do criador do app (normalmente em até 1 dia útil).
            {barrado ? " Esta tela confere sozinha a cada 30 segundos." : ""}
          </div>
          {barrado && onConferir && <button onClick={() => { onConferir(); carregarMeus(); }} style={{ ...S.btnGhost, width: "100%", marginTop: 10 }}>🔄 Conferir agora</button>}
        </div>
      )}
      {!planos.length && <div style={{ ...S.card, fontSize: 14, color: "var(--cinza)" }}>Nenhum plano disponível agora. Fale com o criador do app: Instagram @{INSTAGRAM}.</div>}
      <div role="radiogroup" aria-label="Planos" style={{ display: "grid", gap: 8, marginBottom: 12 }}>
        {planos.map((pl) => (
          <button key={pl.id} role="radio" aria-checked={escolhido === pl.id} onClick={() => setEscolhido(pl.id)}
            style={{ ...S.card, marginBottom: 0, textAlign: "left", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10,
              borderColor: escolhido === pl.id ? "var(--marca)" : undefined, borderWidth: escolhido === pl.id ? 2 : 1, color: "var(--texto)" }}>
            <span>
              <span style={{ display: "block", fontWeight: 900, fontSize: 15.5 }}>{escolhido === pl.id ? "◉ " : "○ "}{pl.nome}{pl.id === "anual" ? " ⭐" : ""}</span>
              <span style={{ display: "block", fontSize: 12.5, color: "var(--cinza)", marginTop: 2 }}>{porPeriodo(pl)}</span>
            </span>
            <span style={{ fontWeight: 900, fontSize: 18, whiteSpace: "nowrap" }}>{precoTexto(pl.preco)}</span>
          </button>
        ))}
      </div>
      {plano && (
        <div style={S.card}>
          <div style={S.label}>1. Pague {precoTexto(plano.preco)}</div>
          {temPix && (
            <div style={{ textAlign: "center" }}>
              {qr ? <img src={qr} alt="QR Code do Pix" style={{ width: 210, height: 210, imageRendering: "pixelated", background: "#fff", borderRadius: 10, margin: "8px auto" }} />
                : <div style={{ fontSize: 12.5, color: "var(--cinza)", margin: "6px 0" }}>Use o código abaixo no app do seu banco (Pix › Copia e cola).</div>}
              <textarea readOnly value={copia} rows={3} aria-label="Pix copia e cola" onFocus={(e) => e.target.select()}
                style={{ ...S.input, fontSize: 12, fontFamily: "monospace", marginTop: 6, wordBreak: "break-all" }} />
              <button onClick={copiar} style={{ ...S.btn, width: "100%", marginTop: 8 }}>{copiado ? "✓ Código copiado: cole no app do banco" : "📋 Copiar o código Pix"}</button>
              <div style={{ fontSize: 12, color: "var(--cinza)", marginTop: 6, lineHeight: 1.5 }}>
                O valor e o código do pagamento ({txid}) já vão dentro. Recebedor: {c.pix.nome || "o criador do app"}.
              </div>
            </div>
          )}
          {plano.link && (
            <a href={plano.link} target="_blank" rel="noreferrer" style={{ ...(temPix ? S.btnGhost : S.btn), display: "block", textAlign: "center", textDecoration: "none", marginTop: 10, boxSizing: "border-box" }}>
              {temPix ? "Ou pague pelo link (cartão ou boleto) ↗" : "💳 Pagar pelo link ↗"}
            </a>
          )}
          {!temPix && !plano.link && (
            <div style={{ fontSize: 13.5, color: "var(--cinza)", lineHeight: 1.5 }}>A forma de pagamento ainda não foi cadastrada. Fale com o criador do app: Instagram @{INSTAGRAM}.</div>
          )}
        </div>
      )}
      {plano && (temPix || plano.link) && (
        <div style={S.card}>
          <div style={S.label}>2. Avise que pagou</div>
          <label style={{ display: "block", fontSize: 13, fontWeight: 800, margin: "4px 0 10px" }}>
            Observação (opcional: o nome de quem pagou, se for outra pessoa)
            <input value={nota} onChange={(e) => setNota(e.target.value)} maxLength={200} style={{ ...S.input, marginTop: 5 }} />
          </label>
          <div style={{ border: "1px solid var(--borda2)", borderRadius: 12, padding: "8px 12px", fontSize: 12, color: "var(--cinza)", lineHeight: 1.5 }}>
            <b style={{ color: "var(--texto)" }}>📜 Condições da assinatura</b>
            {CONDICOES_ASSINATURA.itens.map((t, i) => <div key={i} style={{ marginTop: 4 }}>• {t}</div>)}
          </div>
          <label style={{ display: "flex", gap: 10, alignItems: "flex-start", cursor: "pointer", fontSize: 13.5, lineHeight: 1.5, padding: "10px 0 4px" }}>
            <input type="checkbox" checked={aceito} onChange={(e) => setAceito(e.target.checked)} style={{ width: 22, height: 22, flex: "0 0 22px", marginTop: 1, accentColor: "var(--marca)" }} />
            <span>Li e aceito as condições da assinatura e os Termos de Uso.</span>
          </label>
          <button disabled={indo} onClick={() => informar(temPix ? "pix" : "link")} style={{ ...S.btn, width: "100%", marginTop: 6, opacity: indo ? 0.6 : 1 }}>
            {indo ? "Aguarde…" : "✅ Já paguei: avisar o criador do app"}
          </button>
          {msg && <div role="status" style={{ fontSize: 13.5, lineHeight: 1.5, marginTop: 8, color: /^✅/.test(msg) ? "var(--ok)" : "var(--perigo)" }}>{msg}</div>}
        </div>
      )}
      {meus && meus.length > 0 && (
        <div style={S.card}>
          <div style={S.label}>Meus pagamentos</div>
          {meus.map((m) => (
            <div key={m.uid} style={{ fontSize: 13, lineHeight: 1.5, padding: "6px 0", borderTop: "1px solid var(--borda2)" }}>
              {(STATUS_PAGAMENTO[m.status] || {}).icone} <b>{m.planoNome || m.plano}</b> · {precoTexto(m.valor)} · {dataHora(m.em)}
              <span style={{ color: "var(--cinza)" }}> · {(STATUS_PAGAMENTO[m.status] || {}).nome || m.status}{m.motivo ? " (" + m.motivo + ")" : ""}</span>
            </div>
          ))}
        </div>
      )}
      <div style={{ textAlign: "center", fontSize: 13, color: "var(--cinza)", lineHeight: 1.6 }}>
        Dúvidas: Instagram @{INSTAGRAM}<br />
        <button onClick={() => setBackup(baixarBackupLocal() ? "Backup baixado: guarde o arquivo." : "Não consegui baixar neste navegador.")}
          style={{ background: "none", border: "none", color: "var(--marca)", fontWeight: 800, cursor: "pointer", fontSize: 13, padding: "8px 0" }}>💾 Baixar a minha estante (backup)</button>
        {backup && <div role="status">{backup}</div>}
        {onSair && <div><button onClick={onSair} style={{ background: "none", border: "none", color: "var(--cinza)", fontWeight: 700, cursor: "pointer", fontSize: 13, padding: "6px 0" }}>Sair desta conta</button></div>}
      </div>
    </div>
  );
  if (barrado) return <CaixaConta>{conteudo}</CaixaConta>;
  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "16px 16px 40px", color: "var(--texto)", fontFamily: S.app.fontFamily }}>
      <button onClick={onFechar} style={{ background: "none", border: "none", color: "var(--marca)", fontWeight: 800, fontSize: 14, cursor: "pointer", padding: "4px 0 8px" }}>← Voltar ao app</button>
      {conteudo}
    </div>
  );
}

function TelaEsperaConta({ fase, sessao, msg, onConferir, onConferirQuieto, onSair }) {
  const email = sessao && sessao.email;
  const primeiro = String((sessao && sessao.nome) || "").trim().split(" ")[0];
  const [reenviado, setReenviado] = useState("");
  // Aguardando: o app confere sozinho a cada 30 s com a tela aberta. Liberou,
  // entra sem ninguém precisar tocar em nada.
  useEffect(() => {
    if (fase !== "aguardando" || !onConferirQuieto) return undefined;
    const t = setInterval(() => { if (document.visibilityState === "visible") onConferirQuieto(); }, 30000);
    return () => clearInterval(t);
  }, [fase]);
  const textos = {
    conferindo: ["⏳", "Conferindo o seu acesso…", null],
    aguardando: ["🎉", (primeiro ? "Pronto, " + primeiro + "!" : "Pronto!") + " Cadastro enviado",
      "O seu pedido de acesso chegou ao criador do app. Assim que ele liberar, o Super HQs abre sozinho aqui (pode deixar esta tela aberta) ou na próxima vez que você abrir o app."],
    bloqueado: ["⛔", "Acesso bloqueado", "O seu acesso ao Super HQs foi bloqueado." + (sessao && sessao.motivo ? " Motivo: " + sessao.motivo + "." : "") + " Para falar com o criador do app: Instagram @" + INSTAGRAM + "."],
    vencido: ["⌛", "O seu acesso venceu", "O prazo do seu acesso terminou" + (sessao && sessao.ate ? " em " + new Date(sessao.ate).toLocaleDateString("pt-BR") : "") + ". A sua estante continua guardada no aparelho. Para renovar, fale com o criador do app: Instagram @" + INSTAGRAM + ". Assim que ele renovar, toque em Conferir agora."],
    verificar: ["✉️", "Confirme o seu e-mail", "Mandamos um link para " + email + ". Abra o e-mail, toque no link e volte aqui. (Só a conta do dono precisa disto: é o que protege o painel.)"],
    semRede: ["📵", "Sem internet", "Para conferir o seu acesso, o app precisa de internet desta vez. Conecte e toque em Conferir agora."],
    erro: ["⚠️", "Não deu para conferir", msg || "Tente de novo em instantes."],
  };
  const t = textos[fase] || textos.conferindo;
  return (
    <CaixaConta>
      <div style={{ ...S.card, textAlign: "center", marginTop: 18 }}>
        <div style={{ fontSize: 42 }} aria-hidden="true">{t[0]}</div>
        <div style={{ fontSize: 19, fontWeight: 900, margin: "6px 0 8px" }}>{t[1]}</div>
        {t[2] && <div style={{ fontSize: 14, color: "var(--cinza)", lineHeight: 1.55 }}>{t[2]}</div>}
        {fase === "aguardando" && (
          <div style={{ border: "1px solid var(--borda2)", borderRadius: 12, padding: "10px 12px", marginTop: 14, textAlign: "left", fontSize: 13.5, lineHeight: 1.55 }}>
            <b>Enquanto isso:</b> siga o criador do app no Instagram. É por lá que saem as novidades do app.
            <a href={LINK_INSTAGRAM} target="_blank" rel="noreferrer" style={{ ...S.btn, display: "block", textAlign: "center", textDecoration: "none", marginTop: 10, boxSizing: "border-box" }}>Seguir @{INSTAGRAM}</a>
          </div>
        )}
        {email && fase !== "conferindo" && <div style={{ fontSize: 12.5, color: "var(--cinza2)", marginTop: 10 }}>Conta: {email}</div>}
        {fase === "verificar" && (
          <button onClick={async () => {
            try { const s = await tokenValido(lerSessaoConta()); await contaApi.confirmarEmail(s.idToken); setReenviado("Link mandado de novo. Confira o spam também."); }
            catch (x) { setReenviado(erroDeConta(x.message)); }
          }} style={{ ...S.btnGhost, width: "100%", marginTop: 14 }}>Mandar o link de novo</button>
        )}
        {reenviado && <div style={{ fontSize: 12.5, color: "var(--cinza)", marginTop: 8 }}>{reenviado}</div>}
        {(fase === "vencido" || fase === "bloqueado") && (
          <button onClick={() => setReenviado(baixarBackupLocal() ? "Backup baixado: guarde o arquivo." : "Não consegui baixar neste navegador.")}
            style={{ ...S.btnGhost, width: "100%", marginTop: 14 }}>💾 Baixar a minha estante (backup)</button>
        )}
        {fase !== "conferindo" && fase !== "bloqueado" && (
          <button onClick={onConferir} style={{ ...(fase === "aguardando" ? S.btnGhost : S.btn), width: "100%", marginTop: 14 }}>{fase === "verificar" ? "Já confirmei" : "Conferir agora"}</button>
        )}
        {fase !== "conferindo" && (
          <button onClick={onSair} style={{ background: "none", border: "none", color: "var(--marca)", fontWeight: 700, cursor: "pointer", fontSize: 13.5, marginTop: 14 }}>Sair desta conta</button>
        )}
      </div>
    </CaixaConta>
  );
}

// Os termos nos Ajustes: quando foram aceitos, e o texto a um toque
function CartaoTermos() {
  const [lendo, setLendo] = useState(false);
  const a = lerAceiteTermos();
  return (
    <div style={S.card}>
      <div style={S.label}>Termos de Uso</div>
      <div style={{ fontSize: 13.5, color: "var(--cinza)", lineHeight: 1.5 }}>
        {a && a.v === TERMOS_USO.versao
          ? "✅ Você aceitou em " + new Date(a.em).toLocaleDateString("pt-BR") + " (versão de " + new Date(TERMOS_USO.versao + "T12:00:00").toLocaleDateString("pt-BR") + ")."
          : "As regras do app: conteúdo, conta, dados e direitos."}
      </div>
      <button onClick={() => setLendo(true)} style={{ ...S.btnGhost, width: "100%", marginTop: 10 }}>📜 Ler os Termos de Uso</button>
      {lendo && <JanelaTermos onFechar={() => setLendo(false)} />}
    </div>
  );
}

// O cartão da conta nos Ajustes: quem está dentro, trocar a senha, sair,
// apagar a conta e, só para o dono, o painel
function CartaoConta({ onPainel }) {
  const c = CONTA_ATUAL;
  const [aviso, setAviso] = useState("");
  const [apagando, setApagando] = useState(false);
  if (!c) return null;
  const trocarSenha = async () => {
    setAviso("Mandando…");
    try { await contaApi.esqueci(c.email); setAviso("Mandamos para " + c.email + " um link para criar uma senha nova. Olhe também o spam."); }
    catch (x) { setAviso(erroDeConta(x.message)); }
  };
  // LGPD: a pessoa apaga a própria conta sem precisar pedir a ninguém. A
  // estante fica no aparelho.
  const apagar = async () => {
    if (!apagando) { setApagando(true); return; }
    setAviso("Apagando…");
    try {
      const s = await tokenValido(lerSessaoConta());
      try { await contaApi.apagarDoc(s.uid, s.idToken); } catch (x) {}
      await contaApi.apagarConta(s.idToken);
      try { localStorage.removeItem(CHAVE_EMAIL_CONTA); } catch (x) {}
      c.sair();
    } catch (x) { setAviso(erroDeConta(x.message)); setApagando(false); }
  };
  return (
    <div style={S.card}>
      <div style={S.label}>{c.dono ? "👑 Sua conta (dono do app)" : "👤 Sua conta"}</div>
      <div style={{ fontSize: 14, margin: "6px 0 10px" }}>{c.nome ? <b>{c.nome}</b> : null}{c.nome ? " · " : ""}{c.email}</div>
      {c.ate > 0 && <div style={{ fontSize: 13, color: "var(--cinza)", marginBottom: 10 }}>Acesso liberado até {new Date(c.ate).toLocaleDateString("pt-BR")}.</div>}
      {!c.dono && c.plano && ((c.cob && c.cob.ligada) || ["pago", "vitalicio", "cortesia"].indexOf(c.plano.tipo) >= 0) && (
        <div style={{ border: "1px solid var(--borda2)", borderRadius: 12, padding: "10px 12px", marginBottom: 10 }}>
          <div style={{ fontSize: 14, fontWeight: 800 }}>Seu plano: {textoPlanoConta(c.plano, c.cob)}</div>
          {c.cob && c.cob.ligada && c.assinar && (
            <button onClick={c.assinar} style={{ ...S.btnGhost, width: "100%", marginTop: 8 }}>{c.plano.tipo === "vitalicio" ? "💳 Meus pagamentos" : "💳 Planos, renovar e meus pagamentos"}</button>
          )}
        </div>
      )}
      {c.dono && onPainel && (
        <button onClick={onPainel} style={{ ...S.btn, width: "100%", marginBottom: 8 }}>👥 Painel de usuários</button>
      )}
      <button onClick={trocarSenha} style={{ ...S.btnGhost, width: "100%", marginBottom: 8 }}>🔑 Trocar minha senha</button>
      {aviso && <div role="status" style={{ fontSize: 13, color: "var(--cinza)", lineHeight: 1.5, marginBottom: 8 }}>{aviso}</div>}
      <button onClick={c.sair} style={{ ...S.btnGhost, width: "100%", marginBottom: 8 }}>Sair da conta</button>
      {!c.dono && (
        <button onClick={apagar} style={{ background: "none", border: "none", color: apagando ? "var(--perigo)" : "var(--cinza2)", fontWeight: 700, cursor: "pointer", fontSize: 12.5, width: "100%", padding: "6px 0" }}>
          {apagando ? "Toque de novo para apagar a conta de vez (a estante fica no aparelho)" : "Apagar minha conta"}
        </button>
      )}
    </div>
  );
}

function quandoAcessou(ms, agora) {
  if (!ms) return "nunca";
  const d = agora - ms;
  if (d < 60000) return "agora";
  if (d < 3600000) return "há " + Math.floor(d / 60000) + " min";
  if (d < 864e5) return "há " + Math.floor(d / 3600000) + " h";
  if (d < 30 * 864e5) return "há " + Math.floor(d / 864e5) + " " + plural(Math.floor(d / 864e5), "dia", "dias");
  return new Date(ms).toLocaleDateString("pt-BR");
}
