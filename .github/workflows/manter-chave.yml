# Mantém viva a chave que assina o APK (veio do Treino Livre).
#
# Sem o segredo ANDROID_KEYSTORE_B64, a chave fica no cache do Actions, e o
# GitHub apaga o cache que passa 7 dias sem ser lido. Chave nova faria o app
# novo não instalar por cima do antigo e o assetlinks.json deixar de bater.
# Duas vezes por semana, isto só lê o cache. Com o segredo cadastrado, pode ser apagado.
name: Manter a chave do APK

on:
  schedule:
    - cron: "23 9 * * 1,4"
  workflow_dispatch:

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - name: Ler a chave guardada
        uses: actions/cache/restore@v4
        with:
          path: android/app/superhqs.jks
          key: chave-superhqs-v1
          fail-on-cache-miss: true
